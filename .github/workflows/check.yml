name: Validate application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/generate-lab-registry.mjs --check
      - run: node scripts/check-syntax.mjs
      - run: node scripts/check-ci.mjs
