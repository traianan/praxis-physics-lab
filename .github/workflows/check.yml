name: Validate application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check generated files for drift
        run: git diff --exit-code -- public docs/CATALOG_CONTINUT.md
      - run: node scripts/generate-lab-registry.mjs --check
      - run: node scripts/check-syntax.mjs
      - run: node scripts/check-ci.mjs
      - name: Audit accessibility in Chrome
        env:
          PRAXIS_A11Y_FILTER: /simulari/oglinzi-si-lentile/,/simulari/mecanica-cereasca/,/simulari/retele-electrice/,/simulari/efectul-fotoelectric-extern/,/simulari/legea-lui-ohm/,/simulari/rezistenta-unui-fir/,/simulari/condensatorul/,/simulari/calorimetrie/,/simulari/reflexia-refractia/,/simulari/transformarea-politropa/,/simulari/masurarea-unghiurilor/
        run: npm run audit:a11y
