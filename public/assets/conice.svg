<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Familia conicelor</title>
  <desc id="desc">Cerc, elipsă, parabolă și hiperbolă desenate pe axe coordonate.</desc>
  <rect width="640" height="400" rx="28" fill="#f7f5ee"/>
  <g stroke="#d8dfd8" stroke-width="2"><path d="M80 200h480M320 50v300"/></g>
  <g fill="none" stroke="#245b43" stroke-width="8" stroke-linecap="round">
