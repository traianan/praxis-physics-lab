    <path d="M430 110q-85 90 0 180"/><path d="M520 110q85 90 0 180M520 110q-85 90 0 180M430 110q85 90 0 180"/>
  </g>
  <g fill="#d89839"><circle cx="320" cy="200" r="7"/><circle cx="476" cy="200" r="7"/><circle cx="364" cy="200" r="7"/></g>
  <g fill="#17281e" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="middle">
    <text x="155" y="330">Cerc</text><text x="320" y="330">Elipsă</text><text x="430" y="330">Parabolă</text><text x="520" y="330">Hiperbolă</text>
