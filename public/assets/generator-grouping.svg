<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="generator-grouping-title generator-grouping-desc">
  <title id="generator-grouping-title">Gruparea generatoarelor electrice</title>
  <desc id="generator-grouping-desc">Scheme cu surse legate în serie și în paralel, cu bornele paralele conectate la două noduri comune.</desc>
  <rect width="640" height="360" rx="24" fill="#f5f7f2"/>
  <g fill="#164e46" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.4">
    <text x="48" y="67">SERIE</text>
    <text x="48" y="205">PARALEL</text>
  </g>
  <g fill="none" stroke="#26796c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Series loop: the cells sit consecutively in one branch. -->
    <path d="M94 104H229 M247 104H363 M381 104H548V158H94V104"/>
    <!-- Parallel common rails and three source branches. -->
    <path d="M112 228V326 M528 228V326 M112 238H253 M273 238H528 M112 277H253 M273 277H528 M112 316H253 M273 316H528"/>
  </g>
  <g stroke="#d4773d" stroke-width="5" stroke-linecap="round">
    <!-- Two real-source symbols in series. -->
    <path d="M229 88V120 M247 94V114 M363 88V120 M381 94V114"/>
    <!-- Battery symbols across each parallel branch. -->
    <path d="M253 222V254 M273 227V249 M253 261V293 M273 266V288 M253 300V332 M273 305V327"/>
  </g>
  <g fill="#26796c">
    <circle cx="112" cy="238" r="6"/><circle cx="112" cy="277" r="6"/><circle cx="112" cy="316" r="6"/>
    <circle cx="528" cy="238" r="6"/><circle cx="528" cy="277" r="6"/><circle cx="528" cy="316" r="6"/>
  </g>
</svg>
