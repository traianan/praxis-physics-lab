  <style id="praxis-link-colors">/* One link colour across the library, imported lessons and standalone exports. */
:root{--praxis-color-link:var(--praxis-color-primary,#17685f)}
html body a[href],html body a[href]:visited,html body a[href]:hover,html body a[href]:active{color:var(--praxis-link-ink,var(--praxis-color-link))!important}
/* Link controls use a light surface so their common text colour stays readable. */
html body a[href]:is(.button.primary,.btn.primary,.tab.active,.tab[aria-selected=true],.active,.backlink){background:var(--praxis-link-button-background,var(--praxis-color-primary-soft,#e4eeea))!important}
</style></head>
  <body class="lesson-directory">
    <a class="skip-link" href="#main">Sari la conținut</a>
    <header class="topbar directory-topbar">
      <a class="brand" href="../?home=1" aria-label="Acasă — biblioteca de fizică">
        <span class="brand-symbol">p<span>·</span></span>
        <span class="brand-name">praxis<small>SCIENCE LAB</small></span>
      </a>
      <span class="product-name">Fizică interactivă</span>
      <a class="button secondary" href="../?home=1">← Bibliotecă</a>
    </header>

    <main class="directory-main" id="main">
      <nav class="directory-breadcrumb" aria-label="Navigare în aplicație">
        <a href="../?home=1">Bibliotecă</a><span aria-hidden="true">/</span>
        <span aria-current="page">Toate lecțiile</span>
      </nav>

      <section class="directory-hero" aria-labelledby="directory-title">
        <div class="directory-hero-copy">
          <p class="directory-eyebrow">PRAXIS · FIZICĂ INTERACTIVĂ</p>
          <h1 id="directory-title">Toate lecțiile</h1>
          <p>Explorează laboratoarele și experimentele, organizate pe capitole.</p>
        </div>
        <div class="directory-total" aria-live="polite">
          <strong id="lesson-total">—</strong>
          <span id="chapter-total">capitole</span>
        </div>
      </section>

      <section class="directory-controls" aria-label="Caută și navighează în lista lecțiilor">
        <label class="directory-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
          <span class="sr-only">Caută o lecție sau un capitol</span>
          <input id="lesson-search" type="search" autocomplete="off" placeholder="Caută o lecție sau un capitol">
          <kbd>/</kbd>
        </label>
        <div class="directory-actions">
          <button id="expand-chapters" class="button secondary" type="button">Extinde toate</button>
          <button id="collapse-chapters" class="button secondary" type="button">Restrânge toate</button>
        </div>
        <p id="results-summary" class="results-summary" role="status" aria-live="polite"></p>
      </section>

      <nav id="chapter-shortcuts" class="chapter-shortcuts" aria-label="Salt la capitol"></nav>
      <section id="lesson-chapters" class="lesson-chapters" aria-label="Lecții organizate pe capitole"></section>
      <section id="no-results" class="no-results" hidden>
        <span aria-hidden="true">⌕</span>
        <h2>Nu am găsit lecții potrivite</h2>
        <p>Încearcă un alt titlu, fenomen sau capitol.</p>
        <button id="clear-search" class="button secondary" type="button">Șterge căutarea</button>
      </section>
    </main>

    <footer class="page-footer directory-footer"></footer>
    <script type="module" src="./lessons.js"></script>
  </body>
