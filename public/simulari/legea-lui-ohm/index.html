zistența internă r limitează curentul oricât de mică ar fi R.":"Curentul depinde de suma rezistențelor: I = E/(R + r). Rezistența internă r limitează curentul oricât de mică ar fi R.","U = E − r·I: dependența este liniară, cu panta −r. La scurtcircuit, U = 0 și I = E/r.":"U = E − r·I: dependența este liniară, cu panta −r. La scurtcircuit, U = 0 și I = E/r.","Când R = 0, I_sc = E/r. Cu cât r este mai mică, cu atât curentul de scurtcircuit este mai mare — de aceea acumulatorii pot fi periculoși.":"Când R = 0, I_sc = E/r. Cu cât r este mai mică, cu atât curentul de scurtcircuit este mai mare — de aceea acumulatorii pot fi periculoși.","P_u = E²R/(R+r)² are maxim la R = r, cu valoarea E²/(4r). Randamentul este atunci doar 50 %, deci adaptarea nu înseamnă eficiență.":"P_u = E²R/(R+r)² are maxim la R = r, cu valoarea E²/(4r). Randamentul este atunci doar 50 %, deci adaptarea nu înseamnă eficiență.","Voltmetrul măsoară și căderea pe ampermetru, deci U/I = R + R_A. Valoarea iese supraevaluată și se corectează: R = U/I − R_A.":"Voltmetrul măsoară și căderea pe ampermetru, deci U/I = R + R_A. Valoarea iese supraevaluată și se corectează: R = U/I − R_A.","Baterie + bec":"Baterie + bec","Lanternă":"Lanternă","Sursă de laborator":"Sursă de laborator","Acumulator auto":"Acumulator auto","Legea lui Ohm pentru întreg circuitul":"Legea lui Ohm pentru întreg circuitul","sursă reală":"sursă reală","Tensiunea electromotoare se împarte între căderea de tensiune exterioară":"Tensiunea electromotoare se împarte între căderea de tensiune exterioară","și cea interioară":"și cea interioară","E egal U plus u":"E egal U plus u","de unde rezultă":"de unde rezultă","I egal E supra R plus r":"I egal E supra R plus r","Curentul depinde de":"Curentul depinde de","rezistențelor, nu doar de cea exterioară. Cu cât":"rezistențelor, nu doar de cea exterioară. Cu cât","este mai mică, cu atât sursa se apropie de una ideală.":"este mai mică, cu atât sursa se apropie de una ideală.","Situații reale":"Situaț position and velocity graphs","Adunarea vectorilor și componentele lor":"Vector addition and components"}},"courses/legea-lui-ohm/ui":{"locale":"en","namespace":"courses/legea-lui-ohm/ui","messages":{"Sari la conținut":"Skip to content","Un singur raport —":"One simple ratio —","— leagă tensiunea, curentul și rezistența. De la caracteristica unui fir, la circuitul complet cu sursă reală, reostat și măsurători de laborator.":"— connects voltage, current and resistance. Explore a wire’s characteristic, a complete circuit with a real source, a rheostat and laboratory measurements.","De la definiție":"From the definition","unitatea de rezistență":"the unit of resistance","circuitul complet":"the complete circuit","circuit în funcțiune":"circuit in operation","curent I":"current I","tensiune U":"voltage U","rezistență R":"resistance R","Derulează la teorie":"Scroll to theory","Derulează":"Scroll","Circuit electric animat: sursă cu tensiune electromotoare E și rezistență internă r, rezistor R, ampermetru în serie și voltmetru în paralel. Electronii circulă de la borna negativă la cea pozitivă prin circuitul exterior.":"Animated electric circuit: a source with electromotive force E and internal resistance r, resistor R, an ammeter in series and a voltmeter in parallel. Electrons travel from the negative terminal to the positive terminal through the external circuit.","o lege, trei forme":"one law, three forms","Alege ce cauți":"Choose the quantity","Legea lui Ohm leagă trei mărimi. Dacă știi două, a treia se obține printr-o simplă împărțire sau înmulțire.":"Ohm’s law connects three quantities. If you know two, you can find the third with a simple division or multiplication.","Triunghiul U–I–R: U sus, I stânga jos, R dreapta jos":"The U–I–R triangle: U at the top, I at bottom left, R at bottom right","se calculează direct din celelalte două":"is calculated directly from the other two","Grafic intensitate–tensiune: o dreaptă prin origine pentru rezistorul ohmic, o dreaptă cu pantă mai mică pentru o rezistență mai mare și o curbă aplatizată pentru filamentul de bec.":"Current–voltage graph: a straight line through the origin for an ohmic resistor, a shallower line for a higher resistance, and a flattening curve for a lamp filament.","R mic — pantă mare":"Low R — steep slope","R mare — pantă mică":"High R — shallow slope","bec — neliniar":"lamp — nonlinear","panta = 1 / R":"slope = 1 / R","— cu cât dreapta este mai abruptă, cu atât rezistența este mai mică. Filamentul de bec se abate de la dreaptă, pentru că rezistența lui crește cu temperatura.":"— the steeper the line, the lower the resistance. A lamp filament departs from a straight line because its resistance increases with temperature.","Legea lui Ohm — început":"Ohm’s law — start","Testează-ți înțelegerea":"Test your understanding","Zece întrebări scurte despre definiție, caracteristica U–I, circuitul complet, reostat și măsurări. Primești feedback imediat și explicația fiecărui răspuns.":"Ten short questions on the definition, the U–I characteristic, complete circuits, rheostats and measurements. Get immediate feedback and an explanation for every answer.","10 întrebări":"10 questions","scor":"score","progres":"progress","întrebarea {p0} din {p1}":"question {p0} of {p1}","Variante de răspuns":"Answer choices","Corect!":"Correct!","Nu chiar.":"Not quite.","Răspunsul corect: {p0}":"Correct answer: {p0}","Verifică răspunsul":"Check answer","Vezi rezultatul":"See results","Următoarea întrebare":"Next question","Reia testul":"Restart quiz","rezultat final":"final result","din {p0}":"out of {p0}","Excelent — legea lui Ohm nu mai are secrete.":"Excellent — Ohm’s law holds no secrets for you.","Foarte bine — ai prins esențialul.":"Very good — you understand the key ideas.","Bun început — reia circuitul complet și măsurările.":"Good start — revisit the complete circuit and measurements.","Reia teoria și laboratorul, apoi încearcă din nou.":"Review the theory and lab, then try again.","Poți  = r","R = 2r":"R = 2r","R → ∞":"R → ∞","Reostatul legat în serie cu un consumator, când cursorul ia mai mult fir în circuit, …":"When a rheostat in series with a load brings more wire into the circuit, …","crește curentul":"the current increases","scade curentul":"the current decreases","curentul rămâne același":"the current stays the same","tensiunea la borne crește":"the terminal voltage increases","În montajul amonte, valoarea R = U/I obținută din citiri este…":"In the upstream arrangement, the value R = U/I obtained from the readings is…","mai mică decât valoarea reală":"lower than the true value","egală cu valoarea reală":"equal to the true value","mai mare decât valoarea reală":"greater than the true value","independentă de instrumente":"independent of the instruments","Intensitatea curentului este proporțională cu tensiunea și invers proporțională cu rezistența: I = U/R. Celelalte forme (U = RI, R = U/I) sunt echivalente, dar numai a doua variantă are forma corectă.":"Current is directly proportional to voltage and inversely proportional to resistance: I = U/R. The other forms (U = RI, R = U/I) are equivalent, but only the second option has the correct form.","Prin definiție, 1 Ω = 1 V / 1 A. Conductorul lasă să treacă 1 A atunci când la capetele lui se aplică 1 V.":"By definition, 1 Ω = 1 V / 1 A. The conductor carries 1 A when 1 V is applied across its ends.","Proporționalitatea I ∝ U dă o dreaptă prin origine. Panta ei este 1/R, deci o rezistență mai mare înseamnă o dreaptă mai puțin abruptă.":"The proportionality I ∝ U gives a straight line through the origin. Its slope is 1/R, so a higher resistance means a shallower line.","Ampermetrul trebuie străbătut de curentul de măsurat, deci se leagă în serie. Are rezistență internă mică, ca să nu modifice circuitul.":"The current being measured must flow through the ammeter, so it is connected in series. Its internal resistance is small so it does not alter the circuit.","Curentul depinde de suma rezistențelor: I = E/(R + r). Rezistența internă r limitează curentul oricât de mică ar fi R.":"Current depends on the sum of the resistances: I = E/(R + r). Internal resistance r limits the current, however small R becomes.","U = E − r·I: dependența este liniară, cu panta −r. La scurtcircuit, U = 0 și I = E/r.":"U = E − r·I: the relationship is linear, with slope −r. At short circuit, U = 0 and I = E/r.","Când R = 0, I_sc = E/r. Cu cât r este mai mică, cu atât curentul de scurtcircuit este mai mare — de aceea acumulatorii pot fi periculoși.":"When R = 0, I_sc = E/r. The smaller r is, the greater the short-circuit current — which is why batteries can be dangerous.","P_u = E²R/(R+r)² are maxim la R = r, cu valoarea E²/(4r). Randamentul este atunci doar 50 %, deci adaptarea nu înseamnă eficiență.":"P_u = E²R/(R+r)² is greatest at R = r, with a value of E²/(4r). Efficiency is then only 50%, so power matching does not mean high efficiency.","Voltmetrul măsoară și căderea pe ampermetru, deci U/I = R + R_A. Valoarea iese supraevaluată și se corectează: R = U/I − R_A.":"The voltmeter also measures the voltage drop across the ammeter, so U/I = R + R_A. The value is overestimated and corrected using R = U/I − R_A.","Baterie + bec":"Battery + lamp","Lanternă":"Flashlight","Sursă de laborator":"Laboratory supply","Acumulator auto":"Car battery","Legea lui Ohm pentru întreg circuitul":"Ohm’s law for the complete circuit","sursă reală":"real source","Tensiunea electromotoare se împarte între căderea de tensiune exterioară":"The electromotive force is divided between the external voltage drop","și cea interioară":"and the internal voltage drop","E egal U plus u":"E equals U plus u","de unde rezultă":"which gives","I egal E supra R plus r":"I equals E over R plus r","Curentul depinde de":"Current depends on","rezistențelor, nu doar de cea exterioară. Cu cât":"the resistances, not only the external one. The smaller","este mai mică, cu atât sursa se apropie de una ideală.":"is, the closer the source is to an ideal source.","Situații reale":"Real-world examples","arată tot graficul, până la scurtcircuit":"show the full graph, up to short circuit","Reia valorile inițiale":"Reset to initial values","schema circuitului":"circuit diagram","caracteristica sursei U(I)":"source characteristic U(I)","Dreapta pornește din":"The line starts at","(mers în gol) și scade cu panta":"(open circuit) and falls with slope",". Trage punctul pentru a modifica":". Drag the point to change","cădere internă":"internal voltage drop","putere totală":"total power","putere utilă":"useful power","Bilanțul puterilor":"Power balance","bilanțul puterilor":"power balance","util +":"useful +","pierdut =":"lost =","putere utilă în circuitul exterior":"useful power in the external circuit","pierderi pe rezistența internă":"power lost in the internal resistance","Tensiunea electromotoare E":"Electromotive force E","Rezistența internă r":"Internal resistance r","Rezistența exterioară R":"External resistance R","Situații limită":"Limiting cases","Mers în gol":"Open circuit","Adaptare R = r":"Power matching R = r","la adaptare, puterea utilă este maximă:":"at the matching condition, useful power is at its maximum:","O spiră circulară cu curent":"A circular current-carrying loop","Printr-o spiră de diametru":"A loop with diameter","trece curentul dat de o sursă cu":"carries current supplied by a source with",". Sârma are secțiunea de":". The wire has a cross-sectional area of","și rezistivitatea":"and resistivity",". Află intensitatea curentului.":". Find the current.","1 · rezistența spirei":"1 · loop resistance","2 · legea circuitului":"2 · circuit law","Curentul de scurtcircuit ca metodă de măsurare":"Short-circuit current as a measurement method","Un acumulator cu":"A battery with","are curentul de scurtcircuit":"has a short-circuit current of",". Ce rezistor":". What resistor","trebuie legat la borne ca tensiunea să devină":"should be connected across its terminals to make the voltage","1 · r
