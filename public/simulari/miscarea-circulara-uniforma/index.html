ste radial spre centru, ⊥ pe v. Formula vectorială: a = -ω²·R.":"The Δv construction shows that a_cp points radially inwards, perpendicular to velocity. In vector form: a = −ω²R.","Forța centripetă este:":"Centripetal force is:","Un tip nou de forță din natură":"A new type of force in nature","Rezultanta forțelor reale care asigură a_cp: F_cp = m·v²/R = mω²R, NU e forță nouă":"The resultant of real forces that provides a_cp: F_cp = mv²/R = mω²R; it is not an additional force","Egală și opusă forței centrifuge în orice SR":"Equal and opposite to centrifugal force in every reference frame","Forța de inerție din SRNI":"An inertial force in a non-inertial reference frame","F_cp nu este o forță suplimentară. Exemple: frecarea statică în viraj, gravitația pentru un satelit, componenta orizontală a tensiunii la pendulul conic.":"F_cp is not an additional force. Examples: static friction during cornering, gravity for a satellite, and the horizontal component of tension in a conical pendulum.","Pe curba supraînălțată, viteza optimă fără frecare μ=0 este:":"On a banked curve without friction (μ = 0), the design speed is:","Din ecuații cu μ=0: N sinθ = m v²/r, N cosθ = mg ⇒ v₀=√(r g tgθ). La această viteză nu e nevoie de frecare.":"With μ = 0: N sinθ = mv²/r and N cosθ = mg, so v₀ = √(rg tanθ). No friction is needed at this speed.","SIGUR — fără limită superioară în modelul ideal":"SAFE — no upper bound in the ideal model","DERAPAJ SPRE EXTERIOR — v > v_max":"OUTWARD SKID — v > v_max","ALUNECARE SPRE INTERIOR — v < v_min":"INWARD SLIP — v < v_min","SIGUR — în intervalul [v_min, v_max]":"SAFE — within [v_min, v_max]","O - centru":"O — centre","← CENTRU CURBĂ":"← CENTRE OF CURVE","EXTERIOR →":"OUTSIDE →","CUPRINS LECȚIE":"LESSON CONTENTS","Ce este MCU?":"What is uniform circular motion?","Mărimi caracteristice":"Characteristic quantities","Accelerația centripetă":"Centripetal acceleration","Demonstrație Δv":"The Δv construction","Forța centripetă":"Centripetal force","SRI / SRNI centrifugă":"Inertial and rotating frames","Curba supraînălțată":"Banked curves","Simulator MCU":"Circular-motion simulator","LABORATOR 1":"LABORATORY 1","Simulator curbă":"Banked-curve simulator","LABORATOR 2":"LABORATORY 2","Probleme rezolvate":"Worked problems","Quiz final":"Final quiz","Sfat profesor":"Teacher's note","MCU pare simplă (|v|=const) dar accelerația nu e zero! Direcția lui ":"The speed is constant in uniform circular motion, but acceleration is not zero! The direction of "," se schimbă continuu → apare ":" changes continuously, producing "," spre centru.":" towards the centre.","Ce este Mișcarea Circulară Uniformă?":"What is uniform circular motion?"," este mișcarea unui punct material pe o traiectorie circulară cu rază constantă, în care ":" is the motion of a particle along a circular path with constant radius and ",". Deși modulul vitezei nu se schimbă, direcția ei se schimbă în fiecare moment.":". Although speed is constant, the direction of velocity changes at every instant.","Cerc cu centru O și rază R constantă":"A circle with centre O and constant radius R","Tangentă la cerc, ⊥ pe rază":"Tangent to the circle, perpendicular to the radius","Deși spunem „uniformă”, există accelerație. Uniform se referă la modulul vitezei, nu la vectorul viteză.":"Although the motion is uniform, acceleration exists. Uniform refers to the speed, not the velocity vector.","VIZUAL • TANGENTĂ":"VISUAL • TANGENT","R = const • v tangent":"Constant R • tangential velocity","Perioada, frecvența, viteza unghiulară":"Period, frequency and angular velocity","T = timp pentru 1 rotație completă":"T = time for one complete revolution","ν = 1/T = nr. rotații / sec":"ν = 1/T = revolutions per second","Viteză unghiulară":"Angular velocity","DEMONSTRAȚIE • v = ωR":"DERIVATION • v = ωR","Δs = arc = R·Δθ":"Δs = arc length = RΔθ","împărțim la Δt →":"divide by Δt →","Intuiție rapidă":"A quick example","Dacă R = 2 m și faci o rotație în T = 4 s, atunci circumferința = 2πR ≈ 12.56 m, deci v = 12.56/4 = 3.14 m/s. Aceeași viteză liniară, dar ω = 2π/4 = 1.57 rad/s.":"If R = 2 m and one revolution takes T = 4 s, the circumference is 2πR ≈ 12.56 m. Hence v = 12.56/4 = 3.14 m/s and ω = 2π/4 = 1.57 rad/s.","R ↑ ⇒ v ↑ la același ω":"R ↑ ⇒ v ↑ at the same ω","Mereu spre centru • ⊥ pe v":"Always towards the centre • perpendicular to velocity","De ce există accelerație dacă |v|=const?":"Why is there acceleration if speed is constant?","Vectorul viteză își schimbă direcția. Diferența ":"The velocity vector changes direction. The difference ","spre centru, ⊥ pe v":"towards the centre, perpendicular to velocity","Triunghiuri asemenea":"Similar triangles","Δv → centru":"Δv → centre","Demonstrație grafică: Δv orientat spre centru ⇒ a_cp spre centru":"Graphical derivation: Δv points inwards, so centripetal acceleration points towards the centre","Nu este un tip nou de forță!":"It is not a new type of force!","REZULTANTA FORȚELOR REALE":"RESULTANT OF REAL FORCES","Forța centripetă este rezultanta forțelor reale care produce accelerația centripetă. ":"Centripetal force is the resultant of the real forces producing centripetal acceleration. ",", vectorial ":", in vector form ",". Nu este un tip nou de forță.":". It is not a new type of force.","Viraj mașină":"A car taking a bend","F_cp = frecare statică dintre anvelope și șosea":"F_cp = static friction between tyres and road","Satelit / Lună":"Satellite / Moon","F_cp = forța de atracție gravitațională":"F_cp = gravitational attraction","Pendul conic":"Conical pendulum","F_cp = componenta orizontală a tensiunii din fir":"F_cp = horizontal component of the string tension","Cu ω:":"Using ω:","Direcție: spre centru, ⊥ pe v":"Direction: towards the centre, perpendicular to velocity","Forța centrifugă există doar în SRNI":"Centrifugal force is introduced in a rotating reference frame","SRI - SISTEM INERȚIAL":"INERTIAL REFERENCE FRAME","Observatorul de pe sol vede doar ":"An observer on the ground sees the resultant "," spre centru. Mașina virează pentru că frecarea o trage spre centru. Nu există forță centrifugă reală.":" pointing inwards. On a flat road, static friction makes the car turn. No centrifugal inertial force is introduced in this frame.","SRNI - SISTEM NEINERȚIAL • ÎN MAȘINĂ":"NON-INERTIAL REFERENCE FRAME • IN THE CAR","Forța centrifugă: ":"Centrifugal force: ","F_cp + F_cf = 0 în SRNI (echilibru aparent)":"F_cp + F_cf = 0 in the rotating frame (relative equilibrium)","CONCLUZIE • SISTEME DE REFERINȚĂ":"CONCLUSION • REFERENCE FRAMES","Forțele de inerție (inclusiv forța centrifugă) ":"Inertial forces, including centrifugal force, ","există numai în sisteme de referință neinerțiale":"are introduced only in non-inertial reference frames",". Într-un sistem inerțial nu se introduc forțe de inerție. Într-un autobuz care frânează, tendința de deplasare înainte se explică prin inerție.":". No inertial forces are introduced in an inertial frame. In a braking bus, the tendency to move forwards is explained by inertia.","Autobuz care frânează":"A braking bus","De ce se înclină curbele?":"Why are curves banked?","ECUAȚII DE ECHILIBRU LIMITĂ • Ox radial, Oy vertical":"LIMITING FORCE BALANCE • radial Ox, vertical Oy","± depinde de sensul frecării: + pentru v mare (derapaj exterior), - pentru v mic (alunecare interior)":"The signs depend on friction direction: + at high speed (outward skid), − at low speed (inward slip)","v_max • limita superioară":"v_max • upper limit","Dacă v > v_max → derapaj spre exterior":"v > v_max → outward skid","v_min • limita inferioară":"v_min • lower limit","Dacă v < v_min → alunecare spre interior":"v < v_min → inward slip","Caz μ=0":"Case μ = 0","viteză optimă fără frecare":"Design speed without friction","Caz θ=0 (curbă plată)":"Case θ = 0 (flat curve)","doar frecare ține mașina":"Static friction alone makes the car turn","Caz tgθ=μ":"Case tanθ = μ","poți sta pe loc pe curbă":"The vehicle can remain stationary on the bank","AVANTAJE SUPRAÎNĂLȚARE":"BENEFITS OF BANKING","Reduce dependența de frecare (care scade pe ploaie/gheață)":"Less reliance on friction, which decreases in rain or on ice","Componenta N sinθ asigură direct F_cp":"The normal-force component N sinθ contributes directly to F_cp","Confort mai mare, forțe laterale mai mici pentru pasageri":"Greater comfort, with smaller lateral forces on passengers","Poate permite viteze mai mari decât o curbă plată, în funcție de unghi și frecare.":"It may allow higher speeds than a flat curve, depending on bank angle and friction.","Interval sigur: mașina nu derapează dacă v ∈ [v_min , v_max]. Proiectanții aleg θ astfel încât v₀ ≈ viteza medie de trafic.":"The car does not skid if v lies in [v_min, v_max]. Designers choose θ so that v₀ is close to the typical traffic speed.","LABORATOR 1 • SIMULATOR MCU":"LABORATORY 1 • UNIFORM CIRCULAR MOTION","Vezi vectorii în timp real":"Watch the vectors in real time","Ⅱ Pauză":"Ⅱ Pause","▶ Pornește":"▶ Start","↺ Reset":"↺ Reset","Lent ×0,5":"Slow ×0.5","Normal ×1":"Normal ×1","Rapid ×2":"Fast ×2"," traseu":" trail","CONTROALE • VALORI FIZICE":"CONTROLS • PHYSICAL QUANTITIES","Rază R":"Radius R","Viteză unghiulară ω":"Angular velocity ω","Masă m":"Mass m","VALORI INSTANTANEE":"INSTANTANEOUS VALUES","💡 Observă: când ω ↑, T ↓, v ↑ liniar, dar a_cp ↑ cu ω²! De aceea virajele rapide sunt periculoase (forța crește pătratic).":"💡 As ω increases, T decreases and v increases linearly, while a_cp increases with ω². Fast turns require a much larger inward resultant.","LABORATOR 2 • SIMULATOR CURBĂ SUPRAÎNĂLȚATĂ":"LABORATORY 2 • BANKED CURVE","Când derapează mașina?":"When does the car skid?","PARAMETRI CURBĂ":"CURVE PARAMETERS","Unghi supraînălțare θ":"Bank angle θ","Coeficient frecare μ":"Coefficient of friction μ","Rază curbă r":"Curve radius r","Viteză test v":"Test speed v","CALCUL INTERVAL SIGUR":"SAFE SPEED INTERVAL","∞ (fără limită)":"∞ (no upper bound)","Interval sigur: [":"Safe interval: [","Disc orizontal":"Horizontal disk","Un corp se află pe un disc orizontal la distanța R = 0,60 m de axă. Coeficientul de frecare statică este μ = 0,24. Care este turația maximă fără alunecare?":"A particle is on a horizontal disk at a distance R = 0.60 m from the axis. The coefficient of static friction is μ = 0.24. What is the greatest rotation rate without slipping?","Rezolvare pas cu pas:":"Step-by-step solution:","Condiție: F_fmax = F_cp":"Limiting condition: F_fmax = F_cp","R este distanța corpului față de axă, nu diametrul discului. N = mg și F_fmax = μmg. La limită: μmg = mω²R.":"R is the distance from the axis, not the disk diameter. N = mg and F_fmax = μmg. At the limit: μmg = mω²R.","Rezultatul folosește R = 0,60 m și g = 9,81 m/s². Masa corpului se simplifică.":"The result uses R = 0.60 m and g = 9.81 m/s². The particle's mass cancels out.","Curbă supraînălțată":"Banked curve","Calculați v_max pe curbă r=50 m, θ=10°, μ=0.3. Care e intervalul sigur?":"Find v_max for a curve with r = 50 m, θ = 10° and μ = 0.3. What is the safe speed interval?","Date: r=50, g=9.81, sin10°=0.1736, cos10°=0.9848":"Data: r = 50 m, g = 9.81 m/s², sin10° = 0.1736, cos10° = 0.9848","Numărător: sinθ+μcosθ = 0.1736+0.3·0.9848=0.4690":"Numerator: sinθ + μcosθ = 0.1736 + 0.3 × 0.9848 = 0.4690","Numitor: cosθ-μsinθ = 0.9848-0.3·0.1736=0.9327":"Denominator: cosθ − μsinθ = 0.9848 − 0.3 × 0.1736 = 0.9327","Interval sigur [0 , 15.7] m/s. tgθ=0.176 < μ=0.3, deci chiar staționarea e sigură (tgθ ≤ μ).":"Safe interval: [0, 15.7] m/s. Since tanθ = 0.176 < μ = 0.3, the car can also remain stationary (tanθ ≤ μ).","Verifică ce ai învățat":"Check your understanding","Scor: ":"Score: ","✓ Corect! ":"✓ Correct! ","✗ Răspuns greșit. ":"✗ Incorrect answer. ","Finalizează quiz":"Finish quiz","Excelent! Ești pregătit de test!":"Excellent! You are ready for the test!","Bine! Mai recapitulează curbele supraînălțate.":"Good! Review banked curves once more.","Recapitulează accelerația, forțele și curbele supraînălțate.":"Review acceleration, forces and banked curves.","Mișcarea circulară uniformă":"Uniform circular motion","Concepte și mărimi":"Concepts and quantities","Accelerație și forțe":"Acceleration and forces","Curbe supraînălțate":"Banked curves","Laborator MCU":"Circular-motion lab","Laborator viraj":"Cornering lab","Probleme":"Problems","Test":"Quiz","Perioada":"Period","Frecvența":"Frequency","TRAIECTORIE":"PATH","VITEZĂ":"VELOCITY","Modul:":"Magnitude:","Vectorial:":"Vector form:","Direcție:":"Direction:","Resetează":"Reset","Necesar radial, separat de forțele reale:":"Radial requirement, separate from real forces:","Diagramă interactivă de mișcare circulară.":"Interactive circular-motion diagram.","ΣF = m·a_cp = F_cp":"ΣF = m·a_cp = F_cp","n_max = (30/π)√(μg/R) = 18,92 rot/min.":"n_max = (30/π)√(μg/R) = 18.92 rpm.","n = ν·60 = 18.9 rot/min":"n = 60ν = 18.9 rpm","Laborator interactiv de cinematică":"Interactive kinematics laboratory","01 • DEFINIȚIE":"01 • DEFINITION","02 • MĂRIMI CARACTERISTICE":"02 • CHARACTERISTIC QUANTITIES","03 • ACCELERAȚIA CENTRIPETĂ":"03 • CENTRIPETAL ACCELERATION","04 • FORȚA CENTRIPETĂ":"04 • CENTRIPETAL FORCE","05 • SRI vs SRNI":"05 • INERTIAL AND ROTATING FRAMES","06 • CURBA SUPRAÎNĂLȚATĂ":"06 • BANKED CURVES","09 • PROBLEME REZOLVATE":"09 • WORKED PROBLEMS","10 • QUIZ FINAL • 5 ÎNTREBĂRI":"10 • FINAL QUIZ • 5 QUESTIONS","FORMULE CHEIE":"KEY EQUATIONS","Δv → 0 când Δt → 0":"Δv → 0 as Δt → 0","MCU":"UCM","v_min: sinθ-μcosθ=0.1736-0.2954=-0.1218 <0 ⇒ v_min=0":"v_min: sinθ − μcosθ = 0.1736 − 0.2954 = −0.1218 < 0, so v_min = 0","Modul: F_cp = m v² / R":"Magnitude: F_cp = mv²/R","R = 0,60 m • μ = 0,24":"R = 0.60 m • μ = 0.24","Într-un cadru care se rotește uniform împreună cu mobilul, acesta este în repaus relativ. Pentru un cadru în translație cu accelerația a₀, forța de inerție este ":"In a frame rotating uniformly with the particle, it is at relative rest. For a translating frame with origin acceleration a₀, the inertial force is ",", opusă rezultantei centripete pentru repausul relativ în cadrul care se rotește uniform.":", opposite to the centripetal resultant for relative rest in the uniformly rotating frame.","Descarcă lecția offline":"Download the offline lesson","Necesar radial:":"Radial requirement:","Modifică R, ω și m. Viteza este tangentă, iar accelerația și rezultanta centripetă sunt orientate spre centru. Trage mobilul cu degetul sau cu mouseul pentru a schimba faza; folosește și săgețile tastaturii. Vectorii au scări grafice separate, adaptate pentru lizibilitate.":"Change R, ω and m. Velocity is tangential; acceleration and the centripetal resultant point inwards. Drag the particle with a finger or mouse to change its phase, or use the arrow keys. The vectors use separate graphical scales, adjusted for readability.","Scara vectorilor":"Vector scale","Restabilește scara vectorilor la 75%":"Reset vector scale to 75%","Reglaj vizual; valorile fizice nu se modifică.":"Visual adjustment; physical values stay unchanged.","N — reacțiune normală":"N — normal reaction","G — greutate":"G — weight","F_f — frecare":"F_f — friction","ΣF — rezultantă reală":"ΣF — actual resultant","F_cp — necesar radial":"F_cp — radial requirement"," este paralelă cu raza prin mijlocul arcului, orientată spre centrul cercului. În limita Δt → 0, raportul Δv/Δt dă accelerația centripetă instantanee.":" is parallel to the radius through the arc midpoint and points towards the circle centre. In the limit Δt → 0, Δv/Δt gives the instantaneous centripetal acceleration.","Două viteze egale în modul, tangente în două puncte ale cercului.":"Equal-speed velocity vectors, tangent at two points of the circle.","Diferența Δv unește vârfurile vectorilor v₁ și v₂, aduși la aceeași origine.":"The difference Δv joins the tips of v₁ and v₂ when they share an origin.","Vitezele sunt tangente la cerc și au același modul.":"The velocities are tangent to the circle and have equal magnitudes.","Δv se trasează de la vârful lui v₁ la vârful lui v₂.":"Draw Δv from the tip of v₁ to the tip of v₂.","Forțe reale":"Real forces","Comparație — aceeași scară":"Comparison — equal scale","ΣF — rezultantă disponibilă":"ΣF — available resultant","F_cp cerută":"Required F_cp","Comparație — scară comună":"Comparison — common scale","Forțe și necesar radial":"Forces and radial requirement","N, G și F_f sunt forțele reale, iar ΣF = N + G + F_f este rezultanta lor efectivă (suma vectorială). F_cp = mv²/r este rezultanta spre centru necesară pentru mișcarea circulară la viteza aleasă, nu o forță suplimentară. În regimul sigur, ΣF și F_cp coincid: albastru cu roșu întrerupt. Toți vectorii folosesc aceeași scară, inclusiv copiile separate din comparația de jos. Forțele foarte mici au săgeți proporțional scurte; zero este indicat explicit.":"N, G and F_f are the real forces, and ΣF = N + G + F_f is their actual resultant (vector sum). F_cp = mv²/r is the inward resultant needed for circular motion at the selected speed, not an additional force. In the safe regime, ΣF and F_cp coincide: blue with dashed red. All vectors use the same scale, including the separate copies in the lower comparison. Very small forces have proportionally short arrows; zero is explicitly indicated.","ΣF — rezultanta N + G + F_f":"ΣF — resultant N + G + F_f"}}}}});</script><script src="../../shared/sound.js"></script><script src="../../shared/lab-header.js"></script><script src="../../shared/canvas-typography.js"></script><script src="../../shared/scientific-colors.js"></script><script src="../../shared/course-localization.js"></script><script src="../../shared/mcu-model.js"></script><script src="../../shared/mcu.js"></script><style id="praxis-link-colors">/* One link colour across the library, imported lessons and standalone exports. */
