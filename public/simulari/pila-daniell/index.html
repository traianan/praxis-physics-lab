<body data-praxis-course="pila-daniell" data-praxis-laboratory="true"><main id="praxis-original">
<div class="tabs" role="tablist" aria-label="Secțiunea lecției">
<button class="tab" id="tab-experiment" role="tab" data-tab="experiment" aria-controls="experiment" aria-selected="true">Experiment</button>
<button class="tab" id="tab-theory" role="tab" data-tab="theory" aria-controls="theory" aria-selected="false">Explicații și formule</button>
<button class="tab" id="tab-activities" role="tab" data-tab="activities" aria-controls="activities" aria-selected="false">Activități și probleme</button>
<button class="tab" id="tab-quiz" role="tab" data-tab="quiz" aria-controls="quiz" aria-selected="false">Verificare și surse</button></div>
<section id="experiment" role="tabpanel" aria-labelledby="tab-experiment">
<div class="daniell-workspace" data-instrument-layout>
<div class="daniell-visual" data-instrument-role="visual"><div class="scene-scroll"><svg id="scene" viewBox="0 0 600 300" role="img" aria-label="Scenă schematică a pilei Daniell"></svg></div><div id="bridge-legend" class="bridge-legend" data-no-i18n></div><div id="readouts" data-no-i18n></div><div class="daniell-graphs" data-instrument-role="graphs"><svg id="graph" viewBox="0 0 600 120" role="img" aria-label="Istoricul tensiunii și curentului"></svg></div></div>

<div class="transport"><button id="play" class="button primary">Pornire</button><button id="step" class="button secondary">Pas +60 s</button><button id="reset" class="button secondary">Reset</button></div>
<p id="status" role="status" data-no-i18n></p><div class="switches"><label><input id="open" type="checkbox">Circuit deschis</label><label><input id="bridge" type="checkbox" checked>Punte conectată</label></div><div id="parameters"></div>
<button id="export" class="button secondary">Export CSV</button><p class="note">Parametrii încep o măsurare nouă.</p></aside></div>
<p class="note">1 s real = 600 s simulate. Particule simbolice; mișcare proporțională cu sarcina transferată.</p>
<details><summary>Bilanțuri și mase</summary><div id="balance" data-no-i18n></div></details></section>
