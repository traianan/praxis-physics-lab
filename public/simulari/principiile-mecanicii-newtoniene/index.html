i.":"Cele șapte capitole organizează biblioteca. Mișcarea rectilinie și Calcul vectorial sunt în Mișcare; Oglinzi și lentile este în Lumină și radiații.","În optică, Mod tablă extinde scena. Lecțiile importate păstrează lectura pe secțiuni, cu reglaje tactile și mărirea textului.":"În optică, Mod tablă extinde scena. Lecțiile importate păstrează lectura pe secțiuni, cu reglaje tactile și mărirea textului.","Conținutul lecției este în română. Comenzile bibliotecii sunt disponibile în RO și EN.":"Conținutul lecției este în română. Comenzile bibliotecii sunt disponibile în RO și EN.","Conținutul original este păstrat integral: explicații, formule, simulări, exerciții și teste.":"Conținutul original este păstrat integral: explicații, formule, simulări, exerciții și teste.","{count} simulări disponibile":"{count} simulări disponibile","{count} laboratoare disponibile":"{count} laboratoare disponibile","7 capitole · {count} simulări":"7 capitole · {count} simulări","1 capitol · {count} simulări":"1 capitol · {count} simulări","Deschide Mișcarea rectilinie":"Deschide Mișcarea rectilinie","Deschide Calcul vectorial":"Deschide Calcul vectorial","Mișcare rectilinie și graficele poziției și vitezei":"Mișcare rectilinie și graficele poziției și vitezei","Adunarea vectorilor și componentele lor":"Adunarea vectorilor și componentele lor"}},"newton":{"locale":"ro","title":"Principiile mecanicii newtoniene","subtitle":"Forțe, inerție și interacțiuni prin contact","description":"Nouă taburi, șase experimente interactive, calculator de forță medie, patru probleme rezolvate și 14 întrebări: principii, frecare și elasticitate.","alt":"Cărucior accelerat de o forță, cu vectorii forță și accelerație în același sens","messages":{"Principiile mecanicii newtoniene":"Principiile mecanicii newtoniene","Laborator interactiv de dinamică":"Laborator interactiv de dinamică","Concepte":"Concepte","Inerție":"Inerție","Forță și accelerație":"Forță și accelerație","Acțiune–reacțiune":"Acțiune–reacțiune","Forțe și repere":"Forțe și repere","Frecare":"Frecare","Elasticitate":"Elasticitate","Probleme":"Probleme","Test":"Test","Descarcă lecția offline":"Descarcă lecția offline"},"tabs":[["intro","Concepte"],["inertia","Inerție"],["newton2","Forță și accelerație"],["action","Acțiune–reacțiune"],["forces","Forțe și repere"],["friction","Frecare"],["hooke","Elasticitate"],["problems","Probleme"],["quiz","Test"]],"sections":{"intro":{"title":"De la descrierea mișcării la cauzele ei","html":"<p class='newton-lead'>Cinematica descrie traiectoria, viteza și accelerația. Dinamica leagă schimbarea mișcării de interacțiunile dintre corpuri. O forță poate modifica vectorul viteză sau poate deforma un corp.</p><div class='newton-grid'><div class='newton-note'><h3>Ce este un principiu?</h3><p>O lege fundamentală, susținută de observații și experimente, folosită ca punct de plecare al unei teorii. Principiile lui Newton au fost publicate în 1687 și descriu foarte bine corpurile macroscopice la viteze mult mai mici decât viteza luminii. Nu sunt legi fără limite de aplicabilitate.</p></div><div class='newton-note'><h3>Înainte de a începe</h3><p>Recapitulează masa, vectorii, compunerea și descompunerea lor, viteza și accelerația. Pentru fiecare situație: alege corpul, desenează doar forțele care acționează asupra lui, alege axele și aplică principiul al II-lea.</p></div></div><h3>Traseul lecției</h3><p>Explorează cele trei principii, compunerea forțelor și reperele inerțiale, apoi frecarea și elasticitatea. Experimentele permit modificarea parametrilor; problemele și testul verifică interpretarea rezultatelor.</p><div class='newton-formula'>Σ F⃗ = m a⃗<br>p⃗ = m v⃗</div><p>Modelele folosesc g = 9,8 m/s<sup>2</sup>. Desenele sunt schematice; valorile numerice sunt exprimate în SI. Culorile disting mărimile și sunt însoțite de etichete.</p>"},"inertia":{"title":"Principiul I · Inerția","html":"<div class='newton-note'><b>Într-un reper inerțial</b>, un punct material rămâne în repaus sau în mișcare rectilinie uniformă dacă rezultanta forțelor care acționează asupra lui este nulă.</div><div class='newton-formula'>Σ F⃗ = 0 &nbsp; ⇒ &nbsp; a⃗ = 0 &nbsp; ⇒ &nbsp; v⃗ = constant</div><p>Inerția este proprietatea corpurilor de a-și păstra viteza în absența unei rezultante nenule. Masa este măsura inerției: aceeași forță produce o accelerație mai mică unui corp cu masă mai mare. Inerția nu este o forță.</p><p>Echilibrul de translație include repausul și mișcarea rectilinie uniformă. Pentru corpuri extinse, echilibrul complet cere și echilibrul de rotație. Mișcarea circulară uniformă nu este echilibru de translație: direcția vitezei se schimbă.</p>","after":"<h3>Observă și explică</h3><p>Marginea exercită o forță spre centrul cercului. Când marginea dispare, bila pleacă pe tangenta din punctul desprinderii, cu viteza pe care o avea atunci. Neglijăm rezistențele; greutatea și reacțiunea verticală se compensează. O suliță aruncată pe Pământ își schimbă viteza din cauza gravitației și a aerului.</p>"},"newton2":{"title":"Principiul al II-lea · Legea fundamentală a dinamicii","html":"<p>Într-un reper inerțial, pentru un corp cu masă constantă, accelerația este direct proporțională cu rezultanta forțelor și invers proporțională cu masa. Are direcția și sensul rezultantei, care pot fi diferite de cele ale vitezei.</p><div class='newton-formula'>Σ F⃗ = m a⃗ &nbsp; ; &nbsp; a⃗ = Σ F⃗ / m &nbsp; ; &nbsp; 1 N = 1 kg·m/s<sup>2</sup></div><p>Experimentează pe o pistă orizontală fără frecare. Greutatea și normala se compensează. Forța orizontală este rezultanta; la F = 0 corpul aflat în mișcare își păstrează viteza.</p>","after":"<h3 data-content-type='formula'>Impulsul și forța medie</h3><p>Impulsul este vectorul p⃗ = m v⃗. Pentru un punct material de masă constantă, Σ F⃗ = dp⃗/dt. Pe un interval finit, Δp⃗/Δt reprezintă <b>rezultanta medie</b>; nu forța instantanee în general.</p><div class='newton-formula'>F⃗<sub>med</sub> = Δp⃗ / Δt = m Δv⃗ / Δt</div>"},"action":{"title":"Principiul al III-lea · Acțiunile reciproce","html":"<p>Dacă A acționează asupra lui B cu o forță, B acționează simultan asupra lui A cu o forță egală în modul și opusă ca sens. Forțele unei perechi aparțin aceleiași interacțiuni și sunt aplicate <b>unor corpuri diferite</b>.</p><div class='newton-formula'>F⃗<sub>A→B</sub> = −F⃗<sub>B→A</sub></div><p>Nu se anulează în bilanțul forțelor asupra unui singur corp. Sunt forțe interne și se compensează în bilanțul întregului sistem A+B. Accelerațiile pot avea module diferite: |a<sub>1</sub>| / |a<sub>2</sub>| = m<sub>2</sub>/m<sub>1</sub>.</p>","after":"<div class='newton-note'><h3>Identifică perechea corectă</h3><p>Greutatea unui corp și normala suportului nu sunt acțiune–reacțiune: ambele acționează asupra corpului. Perechea greutății este atracția corpului asupra Pământului. Perechea normalei este apăsarea corpului asupra suportului.</p></div><p>Contactul și câmpurile transmit interacțiuni: mâna împinge un obiect, iar Pământul atrage corpul. În aproximarea punctului material sau pentru corpuri sferic simetrice, atracția gravitațională se reprezintă pe linia centrelor.</p>"},"forces":{"title":"Suprapunerea forțelor și reperele inerțiale","html":"<p>Fiecare interacțiune contribuie la rezultantă. Forțele și accelerațiile produse se adună vectorial; modulele lor nu se adună pur și simplu în orice situație.</p><div class='newton-formula'>R⃗ = F⃗<sub>1</sub> + F⃗<sub>2</sub> &nbsp; ; &nbsp; a⃗ = R⃗ / m<br>R = √(F<sub>1</sub><sup>2</sup> + F<sub>2</sub><sup>2</sup> + 2F<sub>1</sub>F<sub>2</sub> cos α)</div>","after":"<h3>Transformările Galilei</h3><p>Două repere inerțiale cu axe paralele se deplasează unul față de celălalt cu viteza constantă u⃗. Pentru origini care coincid la t = 0 și fără rotație:</p><div class='newton-formula'>r⃗ = r⃗′ + u⃗t &nbsp; ; &nbsp; t = t′<br>v⃗ = v⃗′ + u⃗ &nbsp; ; &nbsp; a⃗ = a⃗′</div><p>Principiul relativității clasice: legile mecanicii au aceeași formă în toate reperele inerțiale. Într-un vehicul care accelerează sau într-un reper care se rotește, forma simplă Σ F⃗ = m a⃗ pentru forțele reale nu se aplică fără corecții de reper.</p>"},"friction":{"title":"Interacțiuni prin contact · Apăsare și frecare","html":"<p>Forța de contact are o componentă normală N, perpendiculară pe suprafață, și una tangențială: frecarea. Frecarea se opune alunecării relative sau tendinței de alunecare, nu obligatoriu vitezei corpului față de sol.</p><div class='newton-grid'><div class='newton-note'><h3>Frecarea statică</h3><p>Se ajustează la solicitare până la limita f<sub>s,max</sub> = μ<sub>s</sub>N. Poate fi zero; nu este mereu egală cu valoarea maximă.</p><div class='newton-formula'>0 ≤ f<sub>s</sub> ≤ μ<sub>s</sub>N</div></div><div class='newton-note'><h3>Frecarea la alunecare</h3><p>În modelul frecării uscate Coulomb, f<sub>k</sub> ≈ μ<sub>k</sub>N. Depinde de materiale și de normală; este aproximativ independentă de aria aparentă și de viteză într-un domeniu limitat. Coeficienții sunt adimensionali; de obicei μ<sub>k</sub> ≤ μ<sub>s</sub>.</p></div></div><p>Pe planul înclinat, fără alte forțe: N = mg cos α, iar componenta greutății la vale este mg sin α. Din repaus, alunecarea începe când tan α &gt; μ<sub>s</sub>. Unghiul limită satisface tan φ = μ<sub>s</sub>.</p>","after":"<p>Experimentul pornește din repaus după fiecare modificare. În alunecare: a = g(sin α − μ<sub>k</sub> cos α). Frecarea este orientată în susul planului; la α = 0 și repaus, este nulă.</p><h3>Aplicații</h3><p>Frecarea permite mersul, frânarea, scrisul și transmiterea mișcării prin curele. Lubrifianții, rulmenții și pernele de aer reduc rezistențele.</p><div class='newton-note'><h3 data-content-type='experiment'>Măsoară și compară</h3><p>Cu un dinamometru, trage un corp pe o suprafață orizontală cu viteză constantă: forța citită egalează frecarea la alunecare. Calculează μₖ = F/(mg), apoi repetă pentru alte mase și fețe ale aceluiași corp. Compară cu μₛ = tan φ determinat la începutul alunecării pe un plan cu înclinare variabilă.</p></div>"},"hooke":{"title":"Elasticitate · Legea lui Hooke și tensiunea mecanică","html":"<p>Un corp elastic revine la forma inițială după încetarea solicitării, în limitele domeniului elastic. În domeniul liniar, forța elastică a resortului se opune deformării x măsurate față de lungimea naturală.</p><div class='newton-formula'>F<sub>e,x</sub> = −kx &nbsp; ; &nbsp; |F<sub>e</sub>| = k|x| &nbsp; ; &nbsp; [k] = N/m</div><p><b>Alungirea resortului:</b> x = Δl = l − l<sub>0</sub>, unde l este lungimea deformată, iar l<sub>0</sub> lungimea naturală. La întindere x &gt; 0; la comprimare x &lt; 0.</p><div class='newton-formula'>x = Δl = l − l<sub>0</sub><br>Δl = F<sub>d</sub>/k &nbsp; ; &nbsp; Δl<sub>ech</sub> = mg/k</div><p>F<sub>d</sub> este modulul forței de întindere care echilibrează forța elastică. Formula Δl = F<sub>d</sub>/k se aplică la echilibru, în domeniul de proporționalitate. Pentru corpul suspendat în repaus, F<sub>d</sub> = mg. În animație, x este alungirea instantanee față de lungimea naturală; abaterea de la echilibru este x − Δl<sub>ech</sub>, iar mg/k reprezintă numai alungirea de echilibru.</p><p>Forța aplicată de corp asupra resortului și cea exercitată de resort asupra corpului formează o pereche acțiune–reacțiune. Pe corpul suspendat aflat în echilibru, greutatea și forța elastică se compensează, dar nu formează o astfel de pereche.</p>","after":"<h3>Tensiunea mecanică și modulul lui Young</h3><p>Pentru un fir drept, omogen, cu secțiune constantă S și lungime inițială l<sub>0</sub>, solicitat axial în domeniul liniar:</p><div class='newton-formula'>σ = F<sub>d</sub>/S &nbsp; ; &nbsp; ε = Δl/l<sub>0</sub> &nbsp; ; &nbsp; σ = Eε<br>Δl = F<sub>d</sub>l<sub>0</sub>/(ES)<br>F<sub>d</sub> = (ES/l<sub>0</sub>) Δl &nbsp; ; &nbsp; k<sub>fir</sub> = ES/l<sub>0</sub></div><p>σ este efortul unitar (Pa), ε este deformația relativă (fără unitate), E este modulul lui Young (Pa). Relația k = ES/l<sub>0</sub> este pentru firul întins axial; nu este formula generală a unui resort elicoidal.</p><p>Valori orientative ale lui E: oțel ≈ 200 GPa, aluminiu ≈ 70 GPa, lemn paralel cu fibra ≈ 8–15 GPa. Cauciucul are un răspuns puternic dependent de material și deformare; modelul liniar se folosește numai într-un domeniu potrivit.</p><div class='newton-materials'><h3>Curba de elasticitate a materialelor</h3><p>Curbele sunt schematice, fără scară numerică; nu reprezintă măsurători ale unui material anume. Axa verticală arată tensiunea nominală σ = F<sub>d</sub>/S<sub>0</sub>, iar axa orizontală deformația relativă ε = Δl/l<sub>0</sub>. S<sub>0</sub> este secțiunea inițială. Forma curbei depinde de material și de condițiile încercării.</p><details open><summary>Metal ductil · curbă de tracțiune</summary><figure class='newton-material-chart'><svg viewBox='0 0 600 330' role='img' aria-label='Metal ductil · curbă de tracțiune'><title>Metal ductil · curbă de tracțiune</title><rect x='65' y='30' width='490' height='240' rx='6' fill='#f1f7f3'/><path d='M65 90H555 M65 150H555 M65 210H555 M165 30V270 M265 30V270 M365 30V270 M465 30V270' stroke='#dfebe6' fill='none'/><path d='M65 30V270H565' stroke='#71968b' stroke-width='2' fill='none'/><path d='M60 40L65 30L70 40 M555 265L565 270L555 275' stroke='#71968b' stroke-width='2' fill='none'/><text x='27' y='37'>σ</text><text x='570' y='299'>ε</text><text x='40' y='296'>O</text><path d='M145 170V270 M180 142V270' stroke='#95b3aa' stroke-dasharray='5 5' fill='none'/><path d='M65 270 L145 170 Q164 145 180 142 C205 140 210 146 230 140 C290 120 340 53 405 50 C450 50 500 84 535 105' stroke='#378b87' stroke-width='3.5' fill='none' stroke-linecap='round'/><circle cx='145' cy='170' r='5' fill='#b65647'/><text x='155' y='158'>P</text><circle cx='180' cy='142' r='5' fill='#b65647'/><text x='190' y='130'>L</text><circle cx='405' cy='50' r='5' fill='#b65647'/><text x='415' y='38'>M</text><circle cx='535' cy='105' r='5' fill='#b65647'/><text x='545' y='93'>R</text></svg></figure><ul><li><b>O–P: domeniul liniar.</b> σ = Eε; panta este modulul lui Young E. P este limita de proporționalitate.</li><li><b>P–L: domeniul elastic neliniar.</b> La descărcare, corpul revine la forma inițială, dar legea liniară a lui Hooke nu se mai aplică. L este limita de elasticitate.</li><li><b>Dincolo de L: deformare plastică.</b> După descărcare rămâne o deformație permanentă; pot apărea curgerea și apoi ecruisarea.</li><li><b>M: tensiunea nominală maximă.</b> Urmează gâtuirea; tensiunea nominală poate scădea deoarece se folosește secțiunea inițială S<sub>0</sub>.</li><li><b>R: ruperea.</b> Forma și întinderea regiunilor diferă între metale; nu toate prezintă un palier de curgere distinct.</li></ul></details><details><summary>Material fragil · rupere aproape fără deformare plastică</summary><figure class='newton-material-chart'><svg viewBox='0 0 600 330' role='img' aria-label='Material fragil · rupere aproape fără deformare plastică'><title>Material fragil · rupere aproape fără deformare plastică</title><rect x='65' y='30' width='490' height='240' rx='6' fill='#f1f7f3'/><path d='M65 90H555 M65 150H555 M65 210H555 M165 30V270 M265 30V270 M365 30V270 M465 30V270' stroke='#dfebe6' fill='none'/><path d='M65 30V270H565' stroke='#71968b' stroke-width='2' fill='none'/><path d='M60 40L65 30L70 40 M555 265L565 270L555 275' stroke='#71968b' stroke-width='2' fill='none'/><text x='27' y='37'>σ</text><text x='570' y='299'>ε</text><text x='40' y='296'>O</text><path d='M65 270 L310 66' stroke='#378b87' stroke-width='3.5' fill='none' stroke-linecap='round'/><circle cx='310' cy='66' r='5' fill='#b65647'/><text x='320' y='54'>R</text></svg></figure><p>Un material fragil (de exemplu, sticla) se poate rupe după o deformare mică, cu deformare plastică foarte redusă. R marchează ruperea; nu se presupune un palier de curgere.</p></details><details><summary>Elastomer · elasticitate neliniară</summary><figure class='newton-material-chart'><svg viewBox='0 0 600 330' role='img' aria-label='Elastomer · elasticitate neliniară'><title>Elastomer · elasticitate neliniară</title><rect x='65' y='30' width='490' height='240' rx='6' fill='#f1f7f3'/><path d='M65 90H555 M65 150H555 M65 210H555 M165 30V270 M265 30V270 M365 30V270 M465 30V270' stroke='#dfebe6' fill='none'/><path d='M65 30V270H565' stroke='#71968b' stroke-width='2' fill='none'/><path d='M60 40L65 30L70 40 M555 265L565 270L555 275' stroke='#71968b' stroke-width='2' fill='none'/><text x='27' y='37'>σ</text><text x='570' y='299'>ε</text><text x='40' y='296'>O</text><path d='M65 270 C160 257 260 247 340 200 C410 155 440 95 470 45' stroke='#378b87' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg></figure><p>Un elastomer poate avea deformații elastice mari și un răspuns neliniar. Panta nu este constantă, deci un singur E sau k nu descrie întreaga curbă. Încărcarea și descărcarea sunt idealizate fără histerezis; R marchează o limită schematică de rupere, fără valoare numerică.</p></details></div><div class='newton-note'><h3 data-content-type='experiment'>Determină constanta elastică</h3><p>Fixează o valoare a lui k. Alege cel puțin cinci mase și notează F = mg și Δl la echilibru. Calculează k = F/Δl pentru fiecare pereche și media valorilor. Graficul F în funcție de Δl are panta k; graficul Δl în funcție de F are panta 1/k. Pentru măsurători reale, repetă citirile și estimează incertitudinea. Nu depăși domeniul elastic al resortului.</p></div>"},"problems":{"title":"Probleme rezolvate","html":"<p>Desenează forțele și alege corpul studiat înainte de calcul. Folosește g = 9,8 m/s<sup>2</sup>.</p>"},"quiz":{"title":"Verifică ce ai înțeles","html":"<p>Alege un singur răspuns la fiecare întrebare. Explicația apare imediat. Schimbarea limbii păstrează răspunsurile și scorul.</p>"}},"ui":{"play":"Pornește","pause":"Pauză","reset":"Reinițializează","release":"Elimină marginea","push":"Împinge","mass":"Masă","force":"Forță rezultantă","leftMass":"Masa din stânga","rightMass":"Masa din dreapta","angle":"Unghi α","muS":"Frecare statică μₛ","muK":"Frecare la alunecare μₖ","spring":"Constanta elastică k","graph":"Arată graficul","steps":"Vezi rezolvarea","score":"Scor","answered":"Răspunsuri","retry":"Reia testul","correct":"Corect","wrong":"Răspuns incorect","time":"Timp","speed":"Viteză","acceleration":"Accelerație","extension":"Alungire","equilibrium":"În echilibru","sliding":"Alunecă la vale","normal":"Normală","friction":"Frecare","limit":"Limită statică","meanForce":"Forță medie","deltaV":"Variația vitezei Δv","deltaT":"Interval Δt","impulse":"Calculator de forță medie","constant":"Viteză constantă","inertiaLab":"Bila pe o pistă circulară","newton2Lab":"Cărucior fără frecare","actionLab":"Două corpuri se resping","forcesLab":"Paralelogramul forțelor","frictionLab":"Corp pe plan înclinat","hookeLab":"Resort vertical și graficul forței","inertiaCaption":"Reglează redarea între 0,1× și 2×. Elimină marginea în timpul mișcării: bila pleacă pe tangentă. Cu repetare automată, după ieșire se reiau cercul și desprinderea din același punct. Fără desprindere, bila continuă mișcarea circulară. Reset reface marginea și păstrează opțiunile de redare.","newton2Caption":"Pista nu are frecare. Greutatea G pornește din centrul corpului, vertical în jos; normala N pornește din contactul cu pista, vertical în sus. Săgeata N este decalată puțin spre stânga pentru vizibilitate. N = G = mg. Viteza redării (0,1×–2×) nu schimbă forțele sau accelerația. Repetarea automată reia mișcarea din repaus la capătul pistei; fără repetare, experimentul se oprește. Nu se simulează o ciocnire.","actionCaption":"Forțele de 80 N sunt egale și opuse, aplicate pe corpuri diferite. Contactul durează 0,5 s fizice, apoi forțele dispar și corpurile se mișcă liber. Viteza redării se reglează între 0,1× și 2× (implicit 0,2×), fără să schimbe forțele sau vitezele fizice. Repetarea automată reia experimentul din repaus după intervalul de 3,5 s fizice; fără repetare, animația se oprește. Reset păstrează masele și opțiunile de redare. Săgețile vitezelor sunt subțiri, cu vârfuri distincte și o scară comună pentru cele două corpuri.","forcesCaption":"Liniile punctate completează paralelogramul. Diagonala este rezultanta vectorială.","frictionCaption":"Mișcare din repaus; μₖ este limitat la μₛ. Viteza animației se reglează între 0,1× și 2×, fără să schimbe accelerația fizică. Repetarea automată reia coborârea din repaus; fără repetare, corpul se oprește la capătul scenei. Dacă frecarea statică este suficientă, corpul rămâne în repaus. Vectorii forțelor folosesc aceeași scară în fiecare cadru.","hookeCaption":"Pornirea coboară corpul cu 25% din alungirea de echilibru și îl eliberează. Oscilația ideală, fără amortizare, are perioada T = 2π√(m/k). G acționează din centru în jos, Fₑ din prindere în sus. În timpul mișcării, |Fₑ| = kx variază, iar G = mg rămâne constantă. Sensul pozitiv al axei x este în jos. Fără repetare se arată o perioadă; Reset revine la echilibru și păstrează reglajele. Scara desenului se adaptează.","region":"Scena experimentului","tangent":"Tangentă","contact":"Contact","free":"Mișcare liberă","rest":"Repaus","end":"Capăt de pistă","velocity":"v","deformation":"Deformare x (m)","elasticForce":"Fₑ,ₓ (N)","framesLab":"Două sisteme de referință inerțiale","frameSpeed":"Viteza reperului S′ față de S: u","particleSpeed":"Viteza corpului în S: v","framesCaption":"Axele celor două repere sunt paralele. S este fix în această reprezentare; S′ se deplasează uniform față de S. Pornește animația pentru a urmări corpul P și originea O′. Reglează viteza redării între 0,1× și 2×, fără a modifica vitezele fizice u și v. Repetarea automată reia intervalul 0–3 s; fără repetare, animația se oprește la 3 s. Pauză păstrează momentul curent, iar Reinițializează revine la t = 0 și păstrează reglajele. x = x′ + ut; v = v′ + u; a = a′ = 0.","animationSpeed":"Viteza animației","autoRepeat":"Repetare automată","materialSpecimen":"Corp solicitat","materialMagnified":"Deformare  1 kg. Determină alungirea și forța elastică la echilibru.","kΔl = mg ⇒ Δl = 9,8/50 = <b>0,196 m</b>. Forța elastică are modulul <b>9,8 N</b> și este orientată în sus."]],"questions":[["Dacă rezultanta forțelor este nulă într-un reper inerțial, corpul…",["se oprește imediat","își păstrează vectorul viteză","se mișcă obligatoriu pe cerc","își mărește viteza"],1,"a⃗ = 0: corpul rămâne în repaus sau în mișcare rectilinie uniformă."],["Ce mărime măsoară inerția?",["Greutatea","Masa","Viteza","Accelerația"],1,"Masa este o mărime scalară și măsoară inerția."],["Un corp de 2 kg are a = 8 m/s². Sub aceeași forță, un corp de 5 kg are…",["8 m/s²","3,2 m/s²","5 m/s²","20 m/s²"],1,"F = 16 N; a = 16/5 = 3,2 m/s²."],["Care expresie în unități fundamentale SI este egală cu 1 N?",["1 kg·m/s","1 kg·m/s²","1 kg·m²/s","1 kg·m²/s²"],1,"F = ma ⇒ 1 N = 1 kg·m/s²."],["O minge de 0,2 kg ajunge de la repaus la 8 m/s în 0,1 s. Rezultanta medie este…",["1,6 N","16 N","0,16 N","160 N"],1,"Fmed = mΔv/Δt = 16 N."],["Forțele unei perechi acțiune–reacțiune…",["se aplică aceluiași corp","au module diferite","sunt opuse și se aplică unor corpuri diferite","apar una după alta"],2,"Apar simultan, au module egale și acționează asupra unor corpuri diferite."],["Două persoane de 40 kg și 80 kg se împing reciproc. Cine are accelerația mai mare în timpul contactului?",["Persoana de 80 kg","Persoana de 40 kg","Au accelerații egale","Niciuna"],1,"Forțele au module egale. La jumătate din masă, accelerația are modul dublu."],["În modelul frecării uscate, forța de frecare la alunecare are modulul…",["μₖN","μₛN în orice situație","mg în orice situație","k/x"],0,"fₖ ≈ μₖN. Coeficientul este adimensional."],["Unghiul de început al alunecării din repaus satisface…",["tan φ = μₛ","sin φ = μₖ","φ = 45° mereu","cos φ = μₛ"],0,"La limită, mg sin φ = μₛ mg cos φ."],["La α = 30°, μₛ = 0,4, un corp de 5 kg eliberat din repaus…",["alunecă: 24,5 N depășește limita de aproximativ 16,97 N","rămâne sigur în repaus","are N = 0" e.":"All original content is preserved: explanations, equations, simulations, exercises and tests.","{count} simulări disponibile":"{count} simulations available","{count} laboratoare disponibile":"{count} laboratories available","7 capitole · {count} simulări":"7 chapters · {count} simulations","1 capitol · {count} simulări":"1 chapter · {count} simulations","Deschide Mișcarea rectilinie":"Open Rectilinear motion","Deschide Calcul vectorial":"Open Vector algebra","Mișcare rectilinie și graficele poziției și vitezei":"Rectilinear motion and position and velocity graphs","Adunarea vectorilor și componentele lor":"Vector addition and components"}},"newton":{"locale":"en","title":"Newton’s laws of motion","subtitle":"Forces, inertia and contact interactions","description":"Nine tabs, six interactive experiments, a mean-force calculator, four worked problems and 14 questions: Newton’s laws, friction and elasticity.","alt":"A cart accelerated by a force, with force and acceleration vectors pointing in the same direction","messages":{"Principiile mecanicii newtoniene":"Newton’s laws of motion","Laborator interactiv de dinamică":"Interactive dynamics laboratory","Concepte":"Concepts","Inerție":"Inertia","Forță și accelerație":"Force and acceleration","Acțiune–reacțiune":"Action–reaction","Forțe și repere":"Forces and frames","Frecare":"Friction","Elasticitate":"Elasticity","Probleme":"Problems","Test":"Quiz","Descarcă lecția offline":"Download the offline lesson"},"tabs":[["intro","Concepts"],["inertia","Inertia"],["newton2","Force and acceleration"],["action","Action–reaction"],["forces","Forces and frames"],["friction","Friction"],["hooke","Elasticity"],["problems","Problems"],["quiz","Quiz"]],"sections":{"intro":{"title":"From describing motion to explaining it","html":"<p class='newton-lead'>Kinematics describes trajectories, velocity and acceleration. Dynamics connects changes in motion to interactions between bodies. A force can change the velocity vector or deform a body.</p><div class='newton-grid'><div class='newton-note'><h3>What is a principle?</h3><p>A fundamental law supported by observations and experiments, used as a starting point for a theory. Newton’s laws were published in 1687 and describe macroscopic bodies very well at speeds much lower than the speed of light. They have a limited domain of applicability.</p></div><div class='newton-note'><h3>Before you begin</h3><p>Review mass, vectors, vector addition and resolution, velocity and acceleration. For each situation: choose the body, draw only the forces acting on it, choose axes and apply Newton’s second law.</p></div></div><h3>Lesson route</h3><p>Explore the three laws, force addition and inertial frames, then friction and elasticity. Change parameters in the experiments; use the problems and quiz to check your interpretation.</p><div class='newton-formula'>Σ F⃗ = m a⃗<br>p⃗ = m v⃗</div><p>The models use g = 9.8 m/s<sup>2</sup>. Drawings are schematic; numerical values use SI units. Colours distinguish quantities and are accompanied by labels.</p>"},"inertia":{"title":"First law · Inertia","html":"<div class='newton-note'><b>In an inertial frame</b>, a particle remains at rest or moves in a straight line at constant velocity if the resultant force acting on it is zero.</div><div class='newton-formula'>Σ F⃗ = 0 &nbsp; ⇒ &nbsp; a⃗ = 0 &nbsp; ⇒ &nbsp; v⃗ = constant</div><p>Inertia is the property of bodies to maintain their velocity when the resultant force is zero. Mass measures inertia: the same force produces a smaller acceleration in a more massive body. Inertia is not a force.</p><p>Translational equilibrium includes rest and straight-line motion at constant velocity. For extended bodies, complete equilibrium also requires rotational equilibrium. Uniform circular motion is not translational equilibrium: the direction of velocity changes.</p>","after":"<h3>Observe and explain</h3><p>The rim exerts a force towards the centre. When the rim disappears, the ball leaves along the tangent at the release point, with its velocity at that instant. Resistance is neglected; weight and the vertical normal force balance. A javelin thrown on Earth changes velocity because of gravity and air resistance.</p>"},"newton2":{"title":"Second law · Force and acceleration","html":"<p>In an inertial frame, for a constant-mass body, acceleration is directly proportional to the resultant force and inversely proportional to mass. It points in the direction of the resultant, which need not be the direction of velocity.</p><div class='newton-formula'>Σ F⃗ = m a⃗ &nbsp; ; &nbsp; a⃗ = Σ F⃗ / m &nbsp; ; &nbsp; 1 N = 1 kg·m/s<sup>2</sup></div><p>Experiment on a frictionless horizontal track. Weight and the normal force balance. The horizontal force is the resultant; when F = 0, a moving body maintains its velocity.</p>","after":"<h3 data-content-type='formula'>Momentum and mean force</h3><p>Momentum is the vector p⃗ = m v⃗. For a constant-mass particle, Σ F⃗ = dp⃗/dt. Over a finite interval, Δp⃗/Δt is the <b>mean resultant force</b>; it is not generally the instantaneous force.</p><div class='newton-formula'>F⃗<sub>avg</sub> = Δp⃗ / Δt = m Δv⃗ / Δt</div>"},"action":{"title":"Third law · Action and reaction","html":"<p>If A exerts a force on B, B simultaneously exerts a force of equal magnitude and opposite direction on A. The forces in a pair belong to the same interaction and act on <b>different bodies</b>.</p><div class='newton-formula'>F⃗<sub>A→B</sub> = −F⃗<sub>B→A</sub></div><p>They do not cancel in the force balance of a single body. They are internal forces and cancel in the balance for the combined A+B system. Accelerations can differ in magnitude: |a<sub>1</sub>| / |a<sub>2</sub>| = m<sub>2</sub>/m<sub>1</sub>.</p>","after":"<div class='newton-note'><h3>Identify the correct pair</h3><p>A body’s weight and the support’s normal force are not an action–reaction pair: both act on the body. The partner of weight is the body’s gravitational pull on Earth. The partner of the normal force is the body’s push on the support.</p></div><p>Interactions act through contact or fields: a hand pushes an object, and Earth attracts a body. In the particle approximation or for spherically symmetric bodies, gravitational attraction is represented along the line joining the centres.</p>"},"forces":{"title":"Force superposition and inertial frames","html":"<p>Each interaction contributes to the resultant. Forces and their acceleration contributions add as vectors; their magnitudes cannot simply be added in every situation.</p><div class='newton-formula'>R⃗ = F⃗<sub>1</sub> + F⃗<sub>2</sub> &nbsp; ; &nbsp; a⃗ = R⃗ / m<br>R = √(F<sub>1</sub><sup>2</sup> + F<sub>2</sub><sup>2</sup> + 2F<sub>1</sub>F<sub>2</sub> cos α)</div>","after":"<h3>Galilean transformations</h3><p>Two inertial frames with parallel axes move relative to each other with constant velocity u⃗. If their origins coincide at t = 0 and there is no rotation:</p><div class='newton-formula'>r⃗ = r⃗′ + u⃗t &nbsp; ; &nbsp; t = t′<br>v⃗ = v⃗′ + u⃗ &nbsp; ; &nbsp; a⃗ = a⃗′</div><p>Classical relativity: the laws of mechanics have the same form in all inertial frames. In an accelerating vehicle or a rotating frame, the simple equation Σ F⃗ = m a⃗ for real forces requires frame corrections.</p>"},"friction":{"title":"Contact interactions · Normal force and friction","html":"<p>A contact force has a normal component N, perpendicular to the surface, and a tangential component: friction. Friction opposes relative sliding or its tendency, not necessarily the body’s velocity relative to the ground.</p><div class='newton-grid'><div class='newton-note'><h3>Static friction</h3><p>It adjusts to the applied load up to f<sub>s,max</sub> = μ<sub>s</sub>N. It can be zero; it is not always at its maximum.</p><div class='newton-formula'>0 ≤ f<sub>s</sub> ≤ μ<sub>s</sub>N</div></div><div class='newton-note'><h3>Kinetic friction</h3><p>In the Coulomb dry-friction model, f<sub>k</sub> ≈ μ<sub>k</sub>N. It depends on the materials and normal force and is approximately independent of apparent contact area and speed over a limited range. The coefficients are dimensionless; usually μ<sub>k</sub> ≤ μ<sub>s</sub>.</p></div></div><p>On an incline with no other forces: N = mg cos α and the downhill component of weight is mg sin α. Sliding from rest begins when tan α &gt; μ<sub>s</sub>. The limiting angle satisfies tan φ = μ<sub>s</sub>.</p>","after":"<p>The experiment restarts from rest after each change. During sliding: a = g(sin α − μ<sub>k</sub> cos α). Friction points uphill; at α = 0 and rest, it is zero.</p><h3>Applications</h3><p>Friction enables walking, braking, writing and belt drives. Lubricants, bearings and air cushions reduce resistance.</p><div class='newton-note'><h3 data-content-type='experiment'>Measure and compare</h3><p>Use a force meter to pull a body horizontally at constant speed: the reading equals kinetic friction. Calculate μₖ = F/(mg), then repeat with other masses and faces of the same body. Compare with μₛ = tan φ measured at the onset of sliding on an adjustable incline.</p></div>"},"hooke":{"title":"Elasticity · Hooke’s law and mechanical stress","html":"<p>An elastic body returns to its original shape after unloading, within its elastic range. In the linear range, a spring’s restoring force opposes deformation x measured from its natural length.</p><div class='newton-formula'>F<sub>e,x</sub> = −kx &nbsp; ; &nbsp; |F<sub>e</sub>| = k|x| &nbsp; ; &nbsp; [k] = N/m</div><p><b>Spring extension:</b> x = Δl = l − l<sub>0</sub>, where l is the deformed length and l<sub>0</sub> the natural length. Under tension x &gt; 0; under compression x &lt; 0.</p><div class='newton-formula'>x = Δl = l − l<sub>0</sub><br>Δl = F<sub>d</sub>/k &nbsp; ; &nbsp; Δl<sub>eq</sub> = mg/k</div><p>F<sub>d</sub> is the magnitude of the tensile force balancing the spring force. The formula Δl = F<sub>d</sub>/k applies at equilibrium within the proportional range. For a suspended body at rest, F<sub>d</sub> = mg. In the animation, x is the instantaneous extension from the natural length; displacement from equilibrium is x − Δl<sub>eq</sub>, while mg/k is only the equilibrium extension.</p><p>The force a body applies to a spring and the force the spring applies to the body form an action–reaction pair. On a suspended body in equilibrium, weight and the elastic force balance, but they are not such a pair.</p>","after":"<h3>Mechanical stress and Young’s modulus</h3><p>For a straight, homogeneous wire of constant cross-sectional area S and initial length l<sub>0</sub>, under axial loading in the linear range:</p><div class='newton-formula'>σ = F<sub>d</sub>/S &nbsp; ; &nbsp; ε = Δl/l<sub>0</sub> &nbsp; ; &nbsp; σ = Eε<br>Δl = F<sub>d</sub>l<sub>0</sub>/(ES)<br>F<sub>d</sub> = (ES/l<sub>0</sub>) Δl &nbsp; ; &nbsp; k<sub>wire</sub> = ES/l<sub>0</sub></div><p>σ is stress (Pa), ε is relative strain (dimensionless), and E is Young’s modulus (Pa). The relation k = ES/l<sub>0</sub> applies to an axially stretched wire; it is not the general formula for a helical spring.</p><p>Indicative values of E: steel ≈ 200 GPa, aluminium ≈ 70 GPa, wood parallel to the grain ≈ 8–15 GPa. Rubber responds strongly to material composition and deformation; a linear model is valid only over a suitable range.</p><div class='newton-materials'><h3>Material stress–strain curves</h3><p>These schematic curves have no numerical scale and do not represent measurements of a particular material. The vertical axis shows engineering stress σ = F<sub>d</sub>/S<sub>0</sub>; the horizontal axis shows engineering strain ε = Δl/l<sub>0</sub>. S<sub>0</sub> is the initial cross-sectional area. Curve shape depends on the material and test conditions.</p><details open><summary>Ductile metal · tensile curve</summary><figure class='newton-material-chart'><svg viewBox='0 0 600 330' role='img' aria-label='Ductile metal · tensile curve'><title>Ductile metal · tensile curve</title><rect x='65' y='30' width='490' height='240' rx='6' fill='#f1f7f3'/><path d='M65 90H555 M65 150H555 M65 210H555 M165 30V270 M265 30V270 M365 30V270 M465 30V270' stroke='#dfebe6' fill='none'/><path d='M65 30V270H565' stroke='#71968b' stroke-width='2' fill='none'/><path d='M60 40L65 30L70 40 M555 265L565 270L555 275' stroke='#71968b' stroke-width='2' fill='none'/><text x='27' y='37'>σ</text><text x='570' y='299'>ε</text><text x='40' y='296'>O</text><path d='M145 170V270 M180 142V270' stroke='#95b3aa' stroke-dasharray='5 5' fill='none'/><path d='M65 270 L145 170 Q164 145 180 142 C205 140 210 146 230 140 C290 120 340 53 405 50 C450 50 500 84 535 105' stroke='#378b87' stroke-width='3.5' fill='none' stroke-linecap='round'/><circle cx='145' cy='170' r='5' fill='#b65647'/><text x='155' y='158'>P</text><circle cx='180' cy='142' r='5' fill='#b65647'/><text x='190' y='130'>L</text><circle cx='405' cy='50' r='5' fill='#b65647'/><text x='415' y='38'>M</text><circle cx='535' cy='105' r='5' fill='#b65647'/><text x='545' y='93'>R</text></svg></figure><ul><li><b>O–P: linear range.</b> σ = Eε; the slope is Young’s modulus E. P is the proportionality limit.</li><li><b>P–L: nonlinear elastic range.</b> Unloading restores the initial shape, but the linear form of Hooke’s law no longer applies. L is the elastic limit.</li><li><b>Beyond L: plastic deformation.</b> Permanent strain remains after unloading; yielding and then strain hardening may occur.</li><li><b>M: maximum engineering stress.</b> Necking follows; engineering stress can decrease because it is calculated using the initial area S<sub>0</sub>.</li><li><b>R: fracture.</b> The shape and extent of the regions vary between metals; a distinct yield plateau is not universal.</li></ul></details><details><summary>Brittle material · fracture with little plastic deformation</summary><figure class='newton-material-chart'><svg viewBox='0 0 600 330' role='img' aria-label='Brittle material · fracture with little plastic deformation'><title>Brittle material · fracture with little plastic deformation</title><rect x='65' y='30' width='490' height='240' rx='6' fill='#f1f7f3'/><path d='M65 90H555 M65 150H555 M65 210H555 M165 30V270 M265 30V270 M365 30V270 M465 30V270' stroke='#dfebe6' fill='none'/><path d='M65 30V270H565' stroke='#71968b' stroke-width='2' fill='none'/><path d='M60 40L65 30L70 40 M555 265L565 270L555 275' stroke='#71968b' stroke-width='2' fill='none'/><text x='27' y='37'>σ</text><text x='570' y='299'>ε</text><text x='40' y='296'>O</text><path d='M65 270 L310 66' stroke='#378b87' stroke-width='3.5' fill='none' stroke-linecap='round'/><circle cx='310' cy='66' r='5' fill='#b65647'/><text x='320' y='54'>R</text></svg></figure><p>A brittle material (for example, glass) can fracture at a small strain, with very little plastic deformation. R marks fracture; a yield plateau is not assumed.</p></details><details><summary>Elastomer · nonlinear elasticity</summary><figure class='newton-material-chart'><svg viewBox='0 0 600 330' role='img' aria-label='Elastomer · nonlinear elasticity'><title>Elastomer · nonlinear elasticity</title><rect x='65' y='30' width='490' height='240' rx='6' fill='#f1f7f3'/><path d='M65 90H555 M65 150H555 M65 210H555 M165 30V270 M265 30V270 M365 30V270 M465 30V270' stroke='#dfebe6' fill='none'/><path d='M65 30V270H565' stroke='#71968b' stroke-width='2' fill='none'/><path d='M60 40L65 30L70 40 M555 265L565 270L555 275' stroke='#71968b' stroke-width='2' fill='none'/><text x='27' y='37'>σ</text><text x='570' y='299'>ε</text><text x='40' y='296'>O</text><path d='M65 270 C160 257 260 247 340 200 C410 155 440 95 470 45' stroke='#378b87' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg></figure><p>An elastomer can undergo large elastic strains with a nonlinear response. The slope varies, so a single E or k does not describe the entire curve. Loading and unloading are idealized without hysteresis; R marks a schematic fracture limit, without a numerical value.</p></details></div><div class='newton-note'><h3 data-content-type='experiment'>Determine the spring constant</h3><p>Fix k. Choose at least five masses and record F = mg and the equilibrium extension Δl. Calculate k = F/Δl for each pair and their mean. The F versus Δl graph has slope k; the Δl versus F graph has slope 1/k. For real measurements, repeat readings and estimate uncertainty. Stay within the spring’s elastic range.</p></div>"},"problems":{"title":"Worked problems","html":"<p>Draw the forces and choose the body before calculating. Use g = 9.8 m/s<sup>2</sup>.</p>"},"quiz":{"title":"Check your understanding","html":"<p>Choose one answer per question. An explanation appears immediately. Switching language preserves your answers and score.</p>"}},"ui":{"play":"Start","pause":"Pause","reset":"Reset","release":"Remove the rim","push":"Push apart","mass":"Mass","force":"Resultant force","leftMass":"Left mass","rightMass":"Right mass","angle":"Angle α","muS":"Static friction μₛ","muK":"Kinetic friction μₖ","spring":"Spring constant k","graph":"Show graph","steps":"View solution","score":"Score","answered":"Answered","retry":"Restart quiz","correct":"Correct","wrong":"Incorrect answer","time":"Time","speed":"Speed","acceleration":"Acceleration","extension":"Extension","equilibrium":"In equilibrium","sliding":"Sliding downhill","normal":"Normal force","friction":"Friction","limit":"Static limit","meanForce":"Mean force","deltaV":"Velocity change Δv","deltaT":"Time interval Δt","impulse":"Mean-force calculator","constant":"Constant velocity","inertiaLab":"Ball on a circular track","newton2Lab":"Frictionless cart","actionLab":"Two bodies push apart","forcesLab":"Parallelogram of forces","frictionLab":"Body on an incline","hookeLab":"Vertical spring and force graph","inertiaCaption":"Adjust playback from 0.1× to 2×. Remove the rim while the ball is moving: it leaves along the tangent. With auto repeat, the circular path and release at the same point restart after exit. Without release, the ball continues around the circle. Reset restores the rim and keeps playback settings.","newton2Caption":"The track is frictionless. Weight G acts vertically downwards from the body’s centre; normal force N acts vertically upwards at the track contact. The N arrow is offset slightly to the left for visibility. N = G = mg. Playback speed (0.1×–2×) does not change the forces or acceleration. Auto repeat restarts from rest at the end of the track; without repeat, the experiment stops. No collision is modelled.","actionCaption":"The 80 N forces are equal and opposite and act on different bodies. Contact lasts 0.5 physical seconds, then the forces vanish and the bodies move freely. Playback speed ranges from 0.1× to 2× (default 0.2×), without changing the physical forces or velocities. Auto repeat restarts the experiment from rest after 3.5 physical seconds; without repeat, the animation stops. Reset keeps the masses and playback settings. Velocity arrows use thin shafts, distinct heads and a shared scale for both bodies.","forcesCaption":"Dashed lines complete the parallelogram. Its diagonal is the vector resultant.","frictionCaption":"Motion from rest; μₖ is limited to μₛ. Animation speed ranges from 0.1× to 2× without changing physical acceleration. Auto repeat restarts the descent from rest; without repeat, the body stops at the end of the scene. If static friction is sufficient, the body stays at rest. Force vectors share the same scale in each frame.","hookeCaption":"Start lowers the body by 25% of the equilibrium extension and releases it. The ideal undamped oscillation has period T = 2π√(m/k). G acts downwards from the centre; Fₑ acts upwards at the attachment point. During motion, |Fₑ| = kx varies while G = mg stays constant. The positive x direction is downwards. Without repeat, one period is shown; Reset returns to equilibrium and keeps your settings. The drawing scale adapts.","region":"Experiment scene","tangent":"Tangent","contact":"Contact","free":"Free motion","rest":"At rest","end":"End of track","velocity":"v","deformation":"Deformation x (m)","elasticForce":"Fₑ,ₓ (N)","framesLab":"Two inertial reference frames","frameSpeed":"Speed of frame S′ relative to S: u","particleSpeed":"Particle velocity in S: v","framesCaption":"The axes of the two frames are parallel. S is fixed in this view; S′ moves uniformly relative to S. Start the animation to follow particle P and origin O′. Adjust playback from 0.1× to 2× without changing the physical velocities u and v. Auto repeat replays the 0–3 s interval; without repeat, the animation stops at 3 s. Pause preserves the current instant; Reset returns to t = 0 and keeps your settings. x = x′ + ut; v = v′ + u; a = a′ = 0.","animationSpeed":"Animation speed","autoRepeat":"Auto repeat","materialSpecimen":"Loaded specimen","materialMagnified":"Deformation magnified","materialLevel":"Maximum loading on curve","materialReady":"Ready","materialLoading":"Loading","materialUnloading":"Unloading","materialDone":"Cycle complete","materialPermanent":"Permanent deformation","materialRecovered":"Original shape restored","materialCycleNote":"With “Load to fracture (R)”, the marker follows the entire curve in 6 s at 1×; the specimen breaks exactly at R, then the fragments separate. The marker stays at R to record fracture; afterwards the specimen transmits no force. Otherwise, the level (%) sets maximum loading on the schematic curve, not real strain in percent: unloading follows in an 8 s cycle. The dashed line is the plastic unloading path, leaving permanent extension; it is not continued loading towards R. Auto repeat restores a fresh specimen. Reset keeps your settings. Curves, fracture and magnified deformation are schematic; elastomer recovery is idealized without hysteresis.","materialFractureMode":"Load to fracture (R)","materialBroken":"R · Specimen fractured — transmitted force drops to zero"},"problems":[["Same force, different masses","A body with m<sub>1</sub> = 2 kg has a<sub>1</sub> = 8 m/s<sup>2</sup>. What acceleration does a 5 kg body have under the same resultant?","F = m<sub>1</sub>a<sub>1</sub> = 16 N; a<sub>2</sub> = F/m<sub>2</sub> = <b>3.2 m/s<sup>2</sup></b>."],["Hitting a ball","A 0.2 kg ball starts from rest and reaches 8 m/s in 0.1 s. Calculate the mean resultant in the direction of motion.","Δp = mΔv = 1.6 kg·m/s; F<sub>avg</sub> = Δp/Δt = <b>16 N</b>."],["Sliding threshold","A 5 kg body is released on an incline with α = 30°, μ<sub>s</sub> = 0.4 and μ<sub>k</sub> = 0.3. Does it slide? What is its acceleration?","N = mg cos 30° ≈ 42.44 N; mg sin 30° = 24.5 N; f<sub>s,max</sub> ≈ 16.97 N. It slides because 24.5 &gt; 16.97. f<sub>k</sub> ≈ 12.73 N; a = (24.5 − 12.73)/5 ≈ <b>2.35 m/s<sup>2</sup></b> downhill."],["Spring equilibrium","A vertical spring with k = 50 N/m supports a 1 kg mass. Find its extension and elastic force at equilibrium.","kΔl = mg ⇒ Δl = 9.8/50 = <b>0.196 m</b>. The elastic force has magnitude <b>9.8 N</b> and points upwards."]],"questions":[["If the resultant force is zero in an inertial frame, a body…",["stops immediately","maintains its velocity vector","must move in a circle","increases its speed"],1,"a⃗ = 0: the body remains at rest or moves in a straight line at constant velocity."],["Which quantity measures inertia?",["Weight","Mass","Velocity","Acceleration"],1,"Mass is a scalar quantity and measures inertia."],["A 2 kg body has a = 8 m/s². Under the same force, a 5 kg body has…",["8 m/s²","3.2 m/s²","5 m/s²","20 m/s²"],1,"F = 16 N; a = 16/5 = 3.2 m/s²."],["Which expression in SI base units equals 1 N?",["1 kg·m/s","1 kg·m/s²","1 kg·m²/s","1 kg·m²/s²"],1,"F = ma ⇒ 1 N = 1 kg·m/s²."],["A 0.2 kg ball goes from rest to 8 m/s in 0.1 s. The mean resultant is…",["1.6 N","16 N","0.16 N","160 N"],1,"Favg = mΔv/Δt = 16 N."],["The forces in an action–reaction pair…",["act on the same body","have different magnitudes","are opposite and act on different bodies","appear one after another"],2,"They appear simultaneously, have equal magnitudes and act on different bodies."],["Two people of 40 kg and 80 kg push each other. Who has the greater acceleration during contact?",["The 80 kg person","The 40 kg person","Their accelerations are equal","Neither"],1,"The forces have equal magnitudes. Half the mass gives twice the acceleration magnitude."],["In the dry-friction model, kinetic friction has magnitude…",["μₖN","μₛN in every situation","mg in every situation","k/x"],0,"fₖ ≈ μₖN. The coefficient is dimensionless."],["The angle at which sliding starts from rest satisfies…",["tan φ = μₛ","sin φ = μₖ","φ is always 45°","cos φ = μₛ"],0,"At the limit, mg sin φ = μₛ mg cos φ."],["At α = 30°, μₛ = 0.4, a 5 kg body released from rest…",["slides: 24.5 N exceeds the limit of about 16.97 N","certainly stays at rest","has N = 0","always moves at constant speed"],0,"The downhill weight component exceeds maximum static friction."],["The elastic-force component along the deformation axis is…",["Fₑ,ₓ = kx","Fₑ,ₓ = −kx","Fₑ,ₓ = k/x","Fₑ,ₓ is always mg"],1,"The minus sign shows that the restoring force opposes deformation."],["A spring with k = 50 N/m supports 1 kg. Its equilibrium extension is…",["0.196 m","1.96 m","0.051 m","49 m"],0,"Δl = mg/k = 9.8/50 = 0.196 m."],["A straight wire has k = ES/l₀. If its initial length doubles while E and S remain constant, k…",["doubles","halves","stays constant","becomes zero"],1,"Axial stiffness is inversely proportional to initial length."],["In two inertial frames related by Galilean transformations, acceleration…",["is always zero","is the same","increases with relative speed","always reverses direction"],1,"The relative velocity of the frames is constant, so a⃗ = a⃗′."]]}}}});</script><script src="../../shared/sound.js"></script><script src="../../shared/lab-header.js"></script><script src="../../shared/canvas-typography.js"></script><script src="../../shared/scientific-colors.js"></script><script src="../../shared/course-localization.js"></script>
