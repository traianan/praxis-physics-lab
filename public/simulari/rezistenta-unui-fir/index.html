unui fir — rezultate":"Resistance of a wire — results","Aplicație de calcul":"Calculation tool","De la date la rezultat, pas cu pas":"From data to result, step by step","Aplicația rezolvă problema ca la tablă: rezistivitatea la temperatura dată, secțiunea din diametru, rezistența, apoi curentul și puterea. Ideal pentru verificarea temelor și pentru prezentarea unui calcul complet.":"Solve the problem step by step: resistivity at the given temperature, cross-sectional area from diameter, resistance, then current and power. Check your homework or present a complete calculation.","calcul live":"live calculation","datele problemei":"problem data","Firul și regimul de lucru":"The wire and operating conditions","Materialul conductor":"Conductor material","Lungimea L":"Length L","Diametrul d":"Diameter d","Temperatura t":"Temperature t","Tensiunea U":"Voltage U","pentru curentul prin fir":"for the current through the wire","rezistența R":"resistance R","curentul I":"current I","U / R, la":"U / R, at","puterea P":"power P","masa firului":"wire mass","rezistivitatea la t":"resistivity at t","Copiat!":"Copied!","Copiază rezultatele":"Copy results","Printează fișa":"Print worksheet","actualizare instant, fără buton „calculează”":"instant update, no Calculate button","rezolvare completă":"complete solution","Ce se întâmplă, în cinci pași":"What happens in five steps","Rezistivitatea la temperatura dată":"Resistivity at the given temperature","α este negativ, deci ρ scade la încălzire.":"α is negative, so ρ decreases when heated.","Secțiunea transversală":"Cross-sectional area","Rezistența firului":"Wire resistance","Curentul prin fir":"Current through the wire","Puterea disipată și masa":"Dissipated power and mass","comparație":"comparison","Aceeași geometrie, alt material":"Same geometry, different material","Tabelul recalculează rezistența pentru fiecare material, păstrând dimensiunile introduse mai sus. Este util când alegi între cupru și aluminiu pentru un cablu sau când explici de ce un reșou folosește nicrom.":"The table recalculates resistance for each material using the dimensions above. Compare copper and aluminium cables or explain why a heater uses nichrome.","I la U":"I at U","Valorile de rezistivitate sunt orientative, la 20 °C, pentru metale și aliaje uzuale; la temperaturi mari, rezistența reală depinde și de răcire și de montaj.":"Resistivity values are approximate, at 20 °C, for common metals and alloys; at high temperatures, actual resistance also depends on cooling and installation.","dublarea lungimii dublează rezistența":"doubling length doubles resistance","Secțiunea":"Cross-section","dublarea secțiunii înjumătățește rezistența":"doubling the area halves resistance","la metale, căldura crește rezistența":"in metals, heating increases resistance","Dublezi lungimea":"Double the length","drumul se lungește, deci și numărul de ciocniri":"a longer path means more collisions","Dublezi aria":"Double the area","de două ori mai multe „benzi” pentru electroni":"twice as many lanes for electrons","Dublezi diametrul":"Double the diameter","atenție: aria crește de patru ori!":"watch out: the area increases fourfold!","Încălzești la 120 °C":"Heat to 120 °C","rețeaua vibrează mai puternic, ciocnirile se înmulțesc":"the lattice vibrates more strongly, increasing collisions","Experimente ghidate":"Guided experiments","Trei pârghii, trei tipuri de dependență":"Three factors, three relationships","Alege un factor și mișcă-l. Curba arată cum se schimbă rezistența când toate celelalte mărimi rămân fixe. Observă diferența dintre o dependență liniară și una inversă.":"Choose a factor and adjust it. The curve shows how resistance changes while all other quantities stay fixed. Compare linear and inverse relationships.","explorare interactivă":"interactive exploration","Factorul de studiat":"Factor to explore","R în funcție de":"R as a function of","cupru ·":"copper ·","rezistența":"resistance","față de referință":"relative to reference","ce se întâmplă":"what happens","Direct proporțional":"Directly proportional","Dacă lungimea crește, crește și rezistența, în aceeași proporție. Graficul este o dreaptă care pleacă din origine:":"As length increases, resistance increases in the same proportion. The graph is a straight line through the origin:","Invers proporțional":"Inversely proportional","Aria stă la numitor, deci graficul este o hiperbolă. Dublezi secțiunea, rezistența scade la jumătate:":"Area is in the denominator, so the graph is a hyperbola. Double the cross-section and resistance halves:","Aproape liniar":"Approximately linear","Rezistivitatea crește aproape liniar cu temperatura, prin coeficientul α:":"Resistivity increases approximately linearly with temperature, through the coefficient α:","Cu α ≈ 0,0039 K⁻¹ la cupru, +100 °C ≈ +39 % R":"With α ≈ 0.0039 K⁻¹ for copper, +100 °C ≈ +39% R","valori reper":"reference values","secțiune de referință":"reference cross-section","lungime de referință":"reference length","temperatură de referință":"reference temperature","patru experimente mintale":"four thought experiments","Ce se întâmplă cu R dacă…":"What happens to R if…","Capcana diametrului.":"The diameter trap.","Dacă dublezi diametrul, aria crește de":"If you double the diameter, the area increases","ori, nu de două ori, pentru că aria depinde de pătratul razei:":"times, not twice, because area depends on the square of the radius:",". De aceea un fir de 2 mm conduce de patru ori mai bine decât unul de 1 mm, nu de două ori.":". Therefore a 2 mm wire conducts four times as well as a 1 mm wire, not twice.","aplicație practică":"practical application","De ce firul de la reșou este subțire și lung, iar cablul de alimentare este gros și scurt? Pentru că avem nevoie de rezistențe foarte diferite: una mare, care produce căldură, una mică, care pierde cât mai puțin.":"Why is a heater wire long and thin, while its supply cable is short and thick? They need very different resistances: a high one to produce heat, and a low one to minimise losses.","Compară materialele":"Compare materials","după rezistență":"by resistance","cel mai bun conductor sus":"best conductor first","după α":"by α","stabilitate cu temperatura":"temperature stability","după densitate":"by density","ușurința construcției":"lightweight construction","Tabel de materiale":"Materials table","Aceeași formă, materiale diferite":"Same shape, different materials","Toate firele din tabel au 1 m lungime și 1 mm² secțiune. Diferența de rezistență vine exclusiv din rezistivitate — adică din material. Alege un rând pentru detalii și pentru comparația cu cuprul.":"Every wire in the table is 1 m long with a 1 mm² cross-section. Differences in resistance come solely from resistivity — the material. Select a row for details and a comparison with copper.","10 materiale":"10 materials","Ordonează tabelul":"Sort the table","ρ la 20 °C · L = 1 m · A = 1 mm²":"ρ at 20 °C · L = 1 m · A = 1 mm²","Rezistivitatea materialelor":"Material resistivity","R la 1 m · 1 mm²":"R at 1 m · 1 mm²","material selectat":"selected material","Metal: electroni aproape liberi, rezistivitate mică și α pozitiv. Se folosește unde contează pierderile mici.":"Metal: nearly free electrons, low resistivity and positive α. Used where low losses matter.","Aliaj cu α foarte mic: rezistența aproape nu se schimbă cu temperatura, de aceea se folosește la rezistențe etalon și la termocuple.":"Alloy with very small α: resistance barely changes with temperature, making it useful for reference resistors and thermocouples.","Aliaj cu rezistivitate mare și rezistență bună la temperaturi înalte — exact ce trebuie pentru un element de încălzire.":"Alloy with high resistivity and good high-temperature resistance — ideal for a heating element.","Nemetal: rețea covalentă, purtători puțini. La grafit α este negativ, deci rezistența scade la încălzire.":"Non-metal: a covalent lattice with few carriers. Graphite has negative α, so resistance decreases when heated.","față de cupru, aceeași formă":"compared with copper, same shape","rezistență":"resistance","aria necesară pentru același R":"area needed for the same R","fir mai gros decât cuprul":"thicker wire than copper","fir mai subțire decât cuprul":"thinner wire than copper","masa la rezistență egală":"mass at equal resistance","mai ușor decât cuprul":"lighter than copper","mai greu decât cuprul":"heavier than copper","De aceea liniile electrice folosesc aluminiu, deși are rezistivitate mai mare: la aceeași rezistență, un conductor de aluminiu cântărește aproximativ":"This is why overhead lines use aluminium despite its higher resistivity: at equal resistance, an aluminium conductor weighs about","jumătate":"half","față de unul de cupru. La reșouri se alege nicromul tocmai pentru că rezistivitatea lui mare produce căldură cu un fir scurt.":"as much as a copper one. Heaters use nichrome because its high resistivity produces heat in a short wire.","Cei mai buni conductori":"The best conductors","Argintul, cuprul și aurul stau în frunte. Argintul conduce cel mai bine, dar costul îl rezervă contactelor; cuprul rămâne standardul practic.":"Silver, copper and gold lead the table. Silver conducts best, but its cost limits it to contacts; copper remains the practical standard.","Compromisul masei":"The mass trade-off","Aluminiul are ρ de circa 1,6 ori mai mare decât cuprul, dar densitatea de 3,3 ori mai mică. La aceeași rezistență iese mai ușor.":"Aluminium has about 1.6 times the resistivity of copper, but 3.3 times lower density. At equal resistance it is lighter.","masa(Al)/masa(Cu) ≈":"mass(Al)/mass(Cu) ≈","Aliaje „stabile”":"Stable alloys","Constantanul are α ≈ 0,00002 K⁻¹: rezistența aproape nu se schimbă cu temperatura. De aceea se folosește la rezistențe etalon și la termocuple.":"Constantan has α ≈ 0.00002 K⁻¹: resistance barely changes with temperature. It is used in reference resistors and thermocouples.","Excepția grafitului":"The graphite exception","La grafit, α este negativ: la încălzire rezistivitatea scade. Comportamentul este tipic pentru semiconductori și nemetale.":"Graphite has negative α: resistivity decreases when heated. This behaviour also occurs in semiconductors and non-metals.","α(grafit) =":"α(graphite) =","cabluri, bobine":"cables, coils","linii aeriene":"overhead lines","rezistențe de putere":"power resistors","reșouri":"heaters","Fizică · electricitate · rezistența conductorului":"Physics · electricity · conductor resistance","Rezistența unui fir":"Resistance of a wire","Fișă de recapitulare: legea firului conductor, secțiunea, efectul temperaturii, legea lui Ohm și tabelul de materiale.":"Revision sheet: conductor resistance, cross-section, temperature effects, Ohm’s law and a materials table.","Legea firului conductor":"Conductor resistance law","Rezistența unui conductor omogen, cu secțiune constantă, este direct proporțională cu lungimea și invers proporțională cu aria secțiunii transversale.":"The resistance of a homogeneous conductor of constant cross-section is directly proportional to its length and inversely proportional to its cross-sectional area.","R — rezistența (Ω); ρ — rezistivitatea (Ω·m); L — lungimea (m); A — aria secțiunii (m²). În practică: ρ în Ω·mm²/m, L în m, A în mm².":"R — resistance (Ω); ρ — resistivity (Ω·m); L — length (m); A — cross-sectional area (m²). In practice: ρ in Ω·mm²/m, L in m, A in mm².","Efectul temperaturii":"Temperature effects","La metale α &gt; 0, deci rezistența crește la încălzire. La grafit α &lt; 0, iar rezistența scade.":"In metals α &gt; 0, so resistance increases when heated. In graphite α &lt; 0, and resistance decreases.","Legea lui Ohm și puterea":"Ohm’s law and power","Rezistivități orientative (20 °C)":"Approximate resistivities (20 °C)","Exercițiu":"Exercise","1. Un fir de nicrom are L = 5 m, d = 0,5 mm și ρ = 1,1 Ω·mm²/m. Calculează A, apoi R. 2. La 12 V, ce curent trece prin fir? 3. Ce putere se disipă?":"1. A nichrome wire has L = 5 m, d = 0.5 mm and ρ = 1.1 Ω·mm²/m. Calculate A, then R. 2. At 12 V, what current flows? 3. What power is dissipated?","Rezistența unui fir · Praxis Science Lab":"Resistance of a wire · Praxis Science Lab","R = ρL/A · rezistivitate · temperatură":"R = ρL/A · resistivity · temperature","Rezistența unui conductor omogen depinde de lungime astfel:":"The resistance of a homogeneous conductor depends on length as follows:","nu depinde de L":"independent of L","R = ρL/A: lungimea stă la numărător, deci rezistența crește proporțional cu ea. Dublezi lungimea, dublezi rezistența.":"R = ρL/A: length is in the numerator, so resistance increases proportionally. Double the length and you double the resistance.","Dacă aria secțiunii transversale se dublează, rezistența…":"If the cross-sectional area doubles, resistance…","se dublează":"doubles","se înjumătățește":"halves","rămâne aceeași":"stays the same","crește de patru ori":"increases fourfold","Aria stă la numitor. R ∼ 1/A, deci 2A duce la R/2. Atenție: dublarea diametrului dublează aria de patru ori, nu de două ori.":"Area is in the denominator. R ∼ 1/A, so 2A gives R/2. Note: doubling diameter multiplies area by four, not two.","Noțiuni":"Concepts","Rezistivitatea ρ este o proprietate a…":"Resistivity ρ is a property of…","firului concret":"the individual wire","tensiunii aplicate":"the applied voltage","ρ caracterizează substanța (și depinde de temperatură). Rezistența R caracterizează obiectul concret și depinde și de L și A.":"ρ characterises the substance and depends on temperature. R characterises the actual object and also depends on L and A.","Unități":"Units","Unitatea SI pentru rezistivitate este…":"The SI unit of resistivity is…","Din R = ρL/A rezultă ρ = RA/L, deci Ω·m²/m = Ω·m. În practică se folosește des și Ω·mm²/m.":"From R = ρL/A we obtain ρ = RA/L, so Ω·m²/m = Ω·m. Ω·mm²/m is also common in practice.","Care dintre aceste materiale conduce cel mai bine?":"Which of these materials conducts best?","Argintul are cea mai mică rezistivitate dintre metale (≈ 0,016 Ω·mm²/m), dar este scump. Cuprul este cel mai folosit în practică.":"Silver has the lowest resistivity among metals (≈ 0.016 Ω·mm²/m), but is expensive. Copper is most widely used in practice.","Temperatură":"Temperature","La un metal, când temperatura crește, rezistența…":"In a metal, as temperature increases, resistance…","crește":"increases","rămâne constantă":"stays constant","devine zero":"becomes zero","Un fir de cupru are L = 2 m și A = 1 mm². Cu ρ ≈ 0,017 Ω·mm²/m, rezistența este aproximativ…":"A copper wire has L = 2 m and A = 1 mm². With ρ ≈ 0.017 Ω·mm²/m, resistance is approximately…","R = ρL/A = 0,017 × 2 / 1 = 0,034 Ω. Un cablu obișnuit are rezistență foarte mică — tocmai de aceea nu se încălzește.":"R = ρL/A = 0.017 × 2 / 1 = 0.034 Ω. An ordinary cable has very low resistance, which limits heating at normal operating currents.","Același fir (0,034 Ω) este conectat la 12 V. Curentul prin el este aproximativ…":"The same wire (0.034 Ω) is connected to 12 V. The current is approximately…","I = U/R = 12 / 0,034 ≈ 353 A. Este un curent uriaș — în realitate sursa nu poate furniza atât, dar calculul arată de ce un scurtcircuit este periculos.":"I = U/R = 12 / 0.034 ≈ 353 A. This is an enormous current — a real source may not supply it, but the calculation shows why a short circuit is dangerous.","Dublezi diametrul unui fir. Rezistența devine…":"Double a wire’s diameter. Its resistance becomes…","de două ori mai mare":"twice as large","de două ori mai mică":"half as large","de patru ori mai mică":"a quarter as large","aceeași":"the same","Aria depinde de d². Dacă diametrul se dublează, aria crește de patru ori, deci R scade de patru ori.":"Area depends on d². Doubling diameter quadruples area, so resistance falls to a quarter.","Aplicații":"Applications","De ce filamentul unui bec este lung și subțire?":"Why is a light-bulb filament long and thin?","ca să aibă rezistență mare și să se încălzească":"to have high resistance and heat up","ca să aibă rezistență mică și să nu se încălzească":"to have low resistance and stay cool","ca să economisească material":"to save material","ca să conducă mai bine curentul":"to conduct current better","Lungimea mare și secțiunea mică măresc rezistența. La un curent dat, P = RI² transformă energie în căldură și lumină.":"A long wire and small cross-section increase resistance. At a given current, P = RI² converts energy into heat and light.","Excelent — stăpânești legea firului.":"Excellent — you understand the wire resistance law.","Foarte bine — ai o imagine clară a dependențelor.":"Very good — you understand the relationships.","Bun început — mai exersează calculul cu unități.":"A good start — practise calculations with units.","Reia teoria și laboratorul, apoi încearcă din nou.":"Review the theory and laboratory, then try again.","Testează-ți intuiția":"Test your intuition","Zece întrebări scurte despre lege, unități, materiale și efectul temperaturii. Primești feedback imediat și explicația fiecărui răspuns.":"Ten short questions about the law, units, materials and temperature effects. Get immediate feedback and an explanation for every answer.","10 întrebări":"10 questions","întrebarea":"question","Variante de răspuns":"Answer options","Corect!":"Correct!","Nu chiar.":"Not quite.","Răspunsul corect:":"Correct answer:","Verifică răspunsul":"Check answer","Vezi rezultatul":"See results","Următoarea întrebare":"Next question","Reia testul":"Restart quiz","rezultat final":"final result","Poți trece la problemele de calcul și la comparația materialelor din laborator.":"You can move on to calculations and material comparisons in the laboratory.","Reia legea R = ρL/A, unitățile și efectul temperaturii, apoi încearcă din nou.":"Review R = ρL/A, units and temperature effects, then try again.","Înapoi la laborator":"Back to the laboratory","Tabelul materialelor":"Materials table","Simularea care a inspirat această lecție: rezistivitate, lungime și arie, cu rezistența afișată în timp real.":"The simulation that inspired this lesson: resistivity, length and area with live resistance readings.","Construiește circuite cu baterii, becuri și fire și măsoară tensiunea și curentul cu voltmetrul și ampermetrul.":"Build circuits with batteries, bulbs and wires, then measure voltage and current with a voltmeter and ammeter.","Explicație concisă a rezistenței, rezistivității și dependenței de temperatură, cu tabele de materiale.":"A concise explanation of resistance, resistivity and temperature dependence, with material tables.","Capitol universitar despre legea lui Ohm, rezistivitate și rezistență, cu exemple rezolvate.":"A university chapter on Ohm’s law, resistivity and resistance, with worked examples.","Resurse și lecție":"Resources and lesson plan","Du lecția mai departe":"Take the lesson further","Un scenariu scurt pentru clasă, linkuri alese pentru aprofundare și o fișă de recapitulare pe care o poți printa sau proiecta la tablă.":"A short classroom plan, selected further-reading links and a revision sheet to print or project.","scenariu de lecție":"lesson plan","45 de minute, pas cu pas":"45 minutes, step by step","la clasă":"in class","Problemă și observație · 8 min":"Problem and observation · 8 min","Arată două fire de aceeași lungime, dar de grosimi diferite, și întreabă care se încălzește mai mult. Fixează apoi legea":"Show two wires of equal length but different thickness, and ask which heats up more. Then establish the law","Experiment virtual · 17 min":"Virtual experiment · 17 min","Deschide laboratorul, rulează preseturile și lasă elevii să prezică rezistența înainte de a mișca sliderul. Compară cu referința de 1 m · 1 mm².":"Open the laboratory, run the presets and ask students to predict resistance before moving the slider. Compare with the 1 m · 1 mm² reference.","Calcul și materiale · 15 min":"Calculations and materials · 15 min","Rezolvă o problemă în calculator, apoi discută tabelul de materiale: de ce cupru la cabluri, nicrom la reșou, aluminiu la linii aeriene.":"Solve a problem in the calculator, then discuss the materials table: copper for cables, nichrome for heaters, aluminium for overhead lines.","Verificare · 5 min":"Assessment · 5 min","Folosește testul scurt ca ieșire din lecție. Fiecare răspuns are explicație, deci discuția pornește imediat.":"Use the short quiz as an exit activity. Each answer has an explanation to start a discussion.","Deschide laboratorul":"Open the laboratory","Testează clasa":"Test the class","linkuri utile":"useful links","Pentru aprofundare":"Further reading","Linkurile se deschid într-o filă nouă și necesită conexiune la internet. Aplicația în sine funcționează local.":"Links open in a new tab and require an internet connection. The application itself works locally.","fișă de recapitulare":"revision sheet","Esențialul, pe o singură pagină":"The essentials on one page","legea firului":"wire resistance law","secțiunea din diametru":"cross-section from diameter","legea lui Ohm":"Ohm’s law","puterea disipată":"dissipated power","conductanța":"conductance","Rezistivități orientative la 20 °C. Pentru calcule exacte, folosește valorile din tabelul de materiale sau datele producătorului.":"Approximate resistivities at 20 °C. For precise calculations, use the values in the materials table or manufacturer data.","Notă didactică.":"Teaching note.","Aplicația folosește modelul conductorului omogen, cu secțiune constantă. Rezistivitatea depinde de temperatură prin coeficientul α; la temperaturi foarte mari apar efecte suplimentare (dilatare, oxidare), care nu sunt modelate aici.":"The application models a homogeneous conductor of constant cross-section. Resistivity depends on temperature through α; at very high temperatures, additional effects such as expansion and oxidation are not modelled.","Densitatea de curent și pragurile de încălzire afișate în laborator sunt orientative, pentru fire de laborator în aer liber. Ele nu înlocuiesc tabelele de sarcini admisibile și nici protecțiile electrice reale.":"The current-density and heating thresholds shown are illustrative, for laboratory wires in free air. They do not replace current-rating tables or real electrical protection.","Cu cât firul este mai lung, cu atât electronii întâlnesc mai mulți ioni pe drum. Dacă dublezi lungimea, se dublează rezistența.":"The longer the wire, the more ions electrons encounter. Doubling length doubles resistance.","Un fir gros oferă mai multe „benzi de circulație”. Aria de două ori mai mare înseamnă rezistență de două ori mai mică.":"A thick wire provides more lanes. Twice the cross-sectional area means half the resistance.","Rezistivitatea este o proprietate a substanței, nu a firului. Cuprul conduce de aproximativ 60 de ori mai bine decât nicromul.":"Resistivity is a property of the substance, not the wire. Copper conducts about 60 times better than nichrome.","La metale, încălzirea mărește agitația ionică și rezistența. La grafit efectul este invers: α este negativ.":"In metals, heating increases lattice vibration and resistance. In graphite the effect is reversed: α is negative.","Definiție și lege":"Definition and law","Ce măsoară, de fapt, rezistența?":"What does resistance actually measure?","Rezistența electrică arată cât de mult se împotrivește un conductor trecerii curentului. Ea nu depinde de tensiune și nici de intensitatea curentului: depinde de forma firului, de materialul din care este făcut și de temperatură.":"Electrical resistance measures how strongly a conductor opposes current. For an ohmic wire at fixed temperature, it depends on shape and material, not on voltage or current.","Rezistența electrică":"Electrical resistance","a unui conductor omogen, cu secțiune constantă, este direct proporțională cu lungimea sa și invers proporțională cu aria secțiunii transversale.":"of a homogeneous conductor of constant cross-section is directly proportional to its length and inversely proportional to its cross-sectional area.","conductor omogen":"homogeneous conductor","secțiune constantă":"constant cross-section","temperatură dată":"given temperature","Rezistența se măsoară în":"Resistance is measured in","ohmi (Ω)":"ohms (Ω)",", cu ohmmetrul. Un ohm este rezistența parcursă de curentul de 1 A când la capetele ei există tensiunea de 1 V. Forma de mai sus este valabilă pentru un conductor liniar, omogen; la secțiuni variabile se lucrează pe porțiuni.":", using an ohmmeter. One ohm is the resistance carrying 1 A when 1 V is applied. The expression above assumes a linear, homogeneous conductor; varying cross-sections require separate segments.","legea firului conductor":"conductor resistance law","relația fundamentală":"fundamental relation","R egal rho ori L supra A":"R equals rho times L divided by A","rezistența, Ω":"resistance, Ω","rezistivitatea, Ω·m":"resistivity, Ω·m","lungimea, m":"length, m","aria secțiunii, m²":"cross-sectional area, m²","în practică se folosește adesea":"often used in practice","cu ρ în Ω·mm²/m, L în m și A în mm²":"with ρ in Ω·mm²/m, L in m and A in mm²","de ce arată astfel legea":"why the law has this form","Firul ca o conductă de apă":"The wire as a water pipe","Un furtun lung opune mai multă rezistență decât unul scurt, iar un furtun gros lasă mai multă apă să treacă decât unul subțire. La fel stau lucrurile și cu electronii: drumul lung și îngust este cel mai greu de parcurs. Diferența este că în fir nu curge apă, ci":"A long hose offers more resistance than a short one, and a wide hose lets more water through than a narrow one. Electrons behave similarly: a long, narrow path is harder to travel. The difference is that a wire carries","sarcină electrică":"electric charge",", iar „frecarea” vine din ciocnirile cu ionii rețelei cristaline.":", and friction comes from collisions with lattice ions.","lungimea furtunului":"hose length","grosimea lui":"its thickness","cât de „încleiat” este interiorul":"how sticky the inside is","același debit, conductă lungă și îngustă":"same flow, long and narrow pipe","același debit, conductă scurtă și largă":"same flow, short and wide pipe","patru pârghii":"four factors","De ce depinde rezistența":"What resistance depends on","Relația":"The relation","are trei factori geometrici și de material. Al patrulea, temperatura, intră prin rezistivitate.":"contains three geometry and material factors. The fourth, temperature, acts through resistivity.","rezistență vs. rezistivitate":"resistance vs resistivity","Aceeași literă, două noțiuni diferite":"Two related symbols, two different concepts","Elevii le confundă des.":"Students often confuse them.","ρ este o constantă de material: spune cât de bine conduce substanța.":"ρ is a material property: it describes how well the substance conducts.","Rezistența":"Resistance","R este o proprietate a obiectului concret și se schimbă dacă tai firul sau îl subțiezi.":"R is a property of the actual object and changes if you cut or thin the wire.","Două fire din același cupru, unul de 10 cm și altul de 10 m, au aceeași rezistivitate, dar rezistențe foarte diferite. Și invers: un fir de cupru și unul de nicrom, tăiate la fel, au rezistențe diferite deși arată identic.":"Two copper wires, one 10 cm long and another 10 m long, have the same resistivity but very different resistances. Conversely, equally sized copper and nichrome wires look alike but have different resistances.","mărimea":"quantity","depinde de":"depends on","material, temperatură":"material, temperature","siemens = 1/ohm":"siemens = 1/ohm","Legea firului se combină cu":"The wire resistance law combines with","pentru o porțiune de circuit,":"for a circuit segment,",": aceeași tensiune produce un curent mai mic într-un fir mai rezistent.":": the same voltage produces less current in a more resistive wire.","Vezi efectul în laborator":"See the effect in the laboratory","referință · 1 m · 1 mm²":"reference · 1 m · 1 mm²","I · sens convențional":"I · conventional direction","e⁻ · deriva electron
