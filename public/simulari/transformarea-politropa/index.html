 same destination. Explore it separately in the laboratory.","căldură":"heat","energie internă":"internal energy","lucru mecanic":"work","fluxul de energie":"energy flow","Cilindru cu piston: moleculele se mișcă, pistonul se deplasează, iar săgețile arată schimbul de căldură și lucrul mecanic.":"Cylinder with a piston: molecules move, the piston travels, and arrows show heat transfer and work.","Caz particular · exercițiul 1.4.1.1":"Special case · exercise 1.4.1.1","Procesul liniar: o dreaptă prin origine":"The linear process: a line through the origin","Când indicele politropic este n = −1, legea pVⁿ = constant devine p = k·V. În coordonate (p, V) obținem o dreaptă care trece prin origine — un caz pe care manualul îl tratează separat.":"When the polytropic exponent is n = −1, pVⁿ = constant becomes p = k·V. In (p, V) coordinates this is a straight line through the origin — a case treated separately in the textbook.","Calculator complet":"Full calculator","de ce n = −1?":"why n = −1?","Pornim de la legea politropei":"Start with the polytropic law",", exponentul devine negativ și relația se rescrie:":", the exponent becomes negative and the equation becomes:","p ori V la minus unu egal constant, deci p egal k ori V":"p times V to the power minus one equals a constant, so p equals k times V","Dreapta trece prin origine, iar panta":"The line passes through the origin, and its slope","rezultă":"gives","căldura molară":"molar heat capacity","constantă pe tot procesul":"constant throughout the process","aria trapezului sub dreaptă":"area of the trapezium under the line","crește mai repede decât volumul":"increases faster than volume","Precizare.":"Note.","Manualul cere „L, γ și V” folosind relațiile (4), (5) și (6). În contextul acestor relații, mărimea care se calculează este căldura molară":"The textbook asks for “L, γ and V” using equations (4), (5) and (6). In this context the quantity calculated is the molar heat capacity","rămâne exponentul adiabatic. Am completat exercițiul și cu dependența":"remains the adiabatic exponent. The exercise also includes the dependence","demo interactiv":"interactive demonstration","Trage punctul 2 pe dreaptă sau folosește sliderul.":"Drag point 2 along the line or use the slider.","Raportul V₂/V₁":"Ratio V₂/V₁","exercițiul 1.4.1.1":"exercise 1.4.1.1","Rezolvare pas cu pas":"Step-by-step solution","Identificăm indicele.":"Identify the exponent.","se scrie":"can be written",", deci procesul este liniar în (p, V), cu":", so the process is linear in (p, V), with","Calculăm căldura molară.":"Calculate the molar heat capacity.","Din":"From","Calculăm lucrul mecanic.":"Calculate the work.","Lucrul este aria trapezului sub dreaptă, echivalent cu relația (5):":"Work is the area of the trapezium under the line, equivalent to equation (5):","Găsim dependența T(V).":"Find the dependence T(V).","și":"and","Verificăm prima lege.":"Check the first law.",", iar":", and","confirmă rezultatul.":"confirms the result.","Cu datele din demo: L =":"With the demonstration inputs: L =","Liniară":"Linear","Izobară":"Isobaric","Izotermă":"Isothermal","Adiabatică":"Adiabatic","Izocoră":"Isochoric","Laborator virtual":"Virtual laboratory","Familia politropelor, în mișcare":"The polytropic family in motion","Alege procesul, reglează starea inițială și urmărește curba, pistonul și fluxul de energie. Trage punctul 2 direct pe grafic sau folosește derularea pentru a explica pas cu pas.":"Choose a process, adjust the initial state and watch the curve, piston and energy flow. Drag point 2 on the chart or scrub through the process to explain it step by step.","grafic interactiv":"interactive chart","Procese simple":"Simple processes","Pauză":"Pause","Rulează procesul":"Run process","Reia de la starea 1":"Return to state 1","Reia animația de la starea 1":"Restart animation from state 1","proces curent":"current process","trage vertical pentru presiunea finală":"drag vertically to set the final pressure","trage punctul 2 pe orizontală":"drag point 2 horizontally","starea 1":"state 1","Derulare proces":"Scrub through the process","starea 2":"state 2","procesul curent":"current process","cilindru cu piston":"cylinder with piston","primește căldură":"absorbs heat","cedează căldură":"releases heat","starea inițială":"initial state","starea finală":"final state","Indicele n":"Exponent n","izocoră: alege alt preset pentru n finit":"isochoric: choose another preset for finite n","n = 1 → izotermă · n = γ → adiabată":"n = 1 → isothermal · n = γ → adiabatic","Raportul p₂/p₁":"Ratio p₂/p₁","crește presiunea la volum constant":"increase pressure at constant volume","destinația punctului 2":"destination of point 2","Reinițializează":"Reset","Calculator pas cu pas":"Step-by-step calculator","bilanț":"balance","Fizică · clasa a X-a · 1.4.1":"Physics · grade 10 · 1.4.1","Fișă de recapitulare: legea, relațiile energetice și procesele simple ale gazului ideal.":"Revision worksheet: the law, energy equations and simple ideal-gas processes.","Definiție":"Definition","Se numește proces (transformare) politropă procesul unui sistem termodinamic închis (ν = constant) în care căldura molară rămâne constantă.":"A polytropic process is a process in a closed thermodynamic system (ν = constant) in which molar heat capacity stays constant.","Relații echivalente":"Equivalent relations","Energia procesului":"Process energy","căldura":"heat","Exercițiu":"Exercise","1 mol de gaz diatomic (C":"1 mol of a diatomic gas (C","= 2,5R) se încălzește izobar cu ΔT = 60 K. Calculează L, ΔU și Q. Verifică apoi rezultatul cu calculatorul din aplicație.":"= 2.5R) is heated isobarically with ΔT = 60 K. Calculate L, ΔU and Q, then check the result using the calculator.","Transformarea politropă · Praxis Science Lab":"Polytropic process · Praxis Science Lab","Mantea & Garabet, Fizică, clasa a X-a, 1.4.1":"Mantea & Garabet, Physics, grade 10, 1.4.1","Într-un proces politrop, mărimea care rămâne constantă este…":"In a polytropic process, the quantity that stays constant is…","Prin definiție, procesul politrop are căldura molară C constantă. ν rămâne și el constant pentru un sistem închis, dar condiția definitorie este C = constant.":"By definition, a polytropic process has constant molar heat capacity C. The amount ν is also constant in a closed system, but the defining condition is C = constant.","Lege":"Law","Legea după care se desfășoară procesul politrop este…":"The law governing a polytropic process is…","Legea politrope este pVⁿ = constant, unde n este indicele politropic. Celelalte forme se obțin cu ecuația termică de stare.":"The polytropic law is pVⁿ = constant, where n is the polytropic exponent. Other forms follow from the ideal-gas equation.","Ce proces corespunde valorii n = 0?":"Which process corresponds to n = 0?","Pentru n = 0, pV⁰ = p = constant: proces izobar. Căldura molară devine C_p.":"For n = 0, pV⁰ = p = constant: an isobaric process. The molar heat capacity is C_p.","Ce proces corespunde valorii n = 1?":"Which process corresponds to n = 1?","Pentru n = 1, pV = constant: proces izoterm. ΔU = 0, deci Q = L; lucrul se calculează cu logaritm, nu cu relația (5).":"For n = 1, pV = constant: an isothermal process. ΔU = 0, so Q = L; work is calculated using the logarithm, not equation (5).","Adiabată":"Adiabatic","Pentru n = γ, căldura schimbată cu exteriorul este…":"For n = γ, the heat exchanged with the surroundings is…","La adiabată Q = 0. Atunci ΔU = −L: gazul se răcește la expansiune și se încălzește la comprimare.":"For an adiabatic process Q = 0. Thus ΔU = −L: the gas cools during expansion and warms during compression.","Limite":"Limits","Când n → ±∞, procesul politrop tinde spre…":"As n → ±∞, the polytropic process approaches…","proces liniar":"linear process","În limita n → ±∞, volumul rămâne constant: proces izocor. Lucrul mecanic este zero, iar C → C_V.":"In the limit n → ±∞, volume stays constant: an isochoric process. Work is zero and C → C_V.","Lucru mecanic":"Work","Pentru n ≠ 1, lucrul mecanic al politropei este…":"For n ≠ 1, the work done in a polytropic process is…","Relația (5) este L = −νRΔT/(n−1). Semnul contează: la expansiune ΔT este negativ pentru n > 1, deci L iese pozitiv.":"Equation (5) is L = −νRΔT/(n−1). The sign matters: during expansion ΔT is negative for n > 1, so L is positive.","Caz particular":"Special case","Procesul liniar p = k·V are indicele politropic…":"The linear process p = k·V has polytropic exponent…","pV⁻¹ = constant se rescrie p = k·V. Este procesul liniar, cu C = (C_p + C_V)/2.":"pV⁻¹ = constant can be written p = k·V. This is the linear process, with C = (C_p + C_V)/2.","Căldura molară":"Molar heat capacity","Relația dintre n și căldura molară C este…":"The relation between n and molar heat capacity C is…","Din Q = ΔU + L și relația Robert Mayer se obține n = (C − C_p)/(C − C_V), echivalent cu C = (C_p − nC_V)/(1−n).":"Q = ΔU + L and Mayer’s relation give n = (C − C_p)/(C − C_V), equivalent to C = (C_p − nC_V)/(1−n).","Calcul":"Calculation","Un mol de gaz diatomic suferă o încălzire izobară cu ΔT = 60 K. Lucrul mecanic este aproximativ…":"One mole of a diatomic gas is heated isobarically with ΔT = 60 K. The work is approximately…","L = pΔV = νRΔT = 1 × 8,314 × 60 ≈ 499 J. Pentru comparație, Q = νC_pΔT ≈ 1 746 J, iar ΔU ≈ 1 247 J.":"L = pΔV = νRΔT = 1 × 8.314 × 60 ≈ 499 J. For comparison, Q = νC_pΔT ≈ 1 746 J and ΔU ≈ 1 247 J.","Excelent — stăpânești familia politropelor.":"Excellent — you understand the polytropic family.","Foarte bine — ai o imagine clară a proceselor.":"Very good — you have a clear picture of the processes.","Bun început — mai exersează cazurile speciale.":"A good start — practise the special cases some more.","Reia teoria și laboratorul, apoi încearcă din nou.":"Review the theory and laboratory, then try again.","Verificare":"Check your knowledge","Testează-ți intuiția":"Test your intuition","Zece întrebări scurte despre definiție, procesele simple, lucru mecanic și căldura molară. Primești feedback imediat și explicația fiecărui răspuns.":"Ten short questions about the definition, simple processes, work and molar heat capacity. Get immediate feedback and an explanation of every answer.","10 întrebări":"10 questions","întrebarea":"question","Variante de răspuns":"Answer options","Corect!":"Correct!","Nu chiar.":"Not quite.","Răspunsul corect:":"Correct answer:","Verifică răspunsul":"Check answer","Vezi rezultatul":"See results","Următoarea întrebare":"Next question","Reia testul":"Restart quiz","rezultat final":"final result","Poți trece la problemele de calcul și la comparația proceselor din laborator.":"You can move on to calculations and process comparisons in the laboratory.","Reia definiția, legea pVⁿ = constant și tabelul proceselor simple, apoi încearcă din nou.":"Review the definition, pVⁿ = constant and the table of simple processes, then try again.","Înapoi la laborator":"Back to laboratory","Simulare de gaz ideal cu piston, presiune, volum și temperatură. Bună pentru o introducere intuitivă.":"Ideal-gas simulation with a piston, pressure, volume and temperature. Useful for an intuitive introduction.","Explicație concisă a procesului politrop, cu legătura dintre exponent, căldură molară și căldură specifică.":"A concise explanation of polytropic processes and the link between exponent, molar heat capacity and specific heat capacity.","Formule, demonstrații și aplicații tehnice ale proceselor politrope, inclusiv cazurile limită.":"Equations, derivations and engineering applications of polytropic processes, including limiting cases.","referință":"reference","Capitol de termodinamică universitară: izobar, izocor, izoterm, adiabat și reprezentări p-V.":"University thermodynamics chapter: isobaric, isochoric, isothermal and adiabatic processes and p–V diagrams.","Resurse și lecție":"Resources and lesson","Du lecția mai departe":"Take the lesson further","Un scenariu scurt pentru clasă, linkuri alese pentru aprofundare și o fișă de reca cru mecanic nu se poate folosi direct: numitorul devine zero. În izotermă se folosește":"Equation (5) for work cannot be used directly: its denominator becomes zero. For an isothermal process use",", deci":", so","Verificare rapidă.":"Quick check.","Pentru 1 mol de gaz diatomic (C":"For 1 mol of a diatomic gas (C","= 2,5R), la o încălzire izobară cu ΔT = 60 K: L = νRΔT ≈ 499 J, ΔU = νC":"= 2.5R), heated isobarically with ΔT = 60 K: L = νRΔT ≈ 499 J, ΔU = νC","ΔT ≈ 1 247 J, iar Q = ΔU + L ≈ 1 746 J.":"ΔT ≈ 1 247 J, and Q = ΔU + L ≈ 1 746 J.","Politropă · n < 0":"Polytropic · n < 0","C_V < C < C_p · căldura molară este între C_V și C_p":"C_V < C < C_p · molar heat capacity lies between C_V and C_p","Politropă · 0 < n < 1":"Polytropic · 0 < n < 1","C > C_p · gazul primește căldură la expansiune":"C > C_p · the gas absorbs heat during expansion","Politropă · 1 < n < γ":"Polytropic · 1 < n < γ","C < 0 · căldura schimbată are semn opus variației de temperatură":"C < 0 · heat transfer and temperature change have opposite signs","Politropă · n > γ":"Polytropic · n > γ","0 < C < C_V · expansiunea răcește gazul":"0 < C < C_V · expansion cools the gas","Laborator p–V":"p–V laboratory","Teorie":"Theory","Proces liniar":"Linear process","Calculator și comparații":"Calculator and comparisons","Test":"Quiz","Resurse":"Resources","Viteza animației":"Animation speed","Scade":"Decrease","Crește":"Increase","gaz":"gas","legea":"law","lucrul":"work","simulare":"simulation","teorie":"theory","manual":"textbook","corect":"correct","din":"of","corect: {0}":"correct: {0}","Grafic presiune-volum pentru procesul {0}. Starea 1: {1} kilopascali, {2} litri. Starea 2: {3} kilopascali, {4} litri.":"Pressure–volume chart for the {0} process. State 1: {1} kilopascals, {2} litres. State 2: {3} kilopascals, {4} litres.","proces":"process","indice":"exponent","izocor":"isochoric","liniar":"linear","izobar":"isobaric","izoterm":"isothermal","adiabat":"adiabatic","verificare":"check",". Temperatura creș
