psă retrogradă la suprafață: când solul se ridică, se mișcă înapoi spre epicentru, apoi coboară și înainte – efect de “val” care răstoarnă fundații. Love zguduie lateral (SH) fără verticală, dar prinsă în crustă → amplitudine mare, lungă durată.":"Rayleigh has horizontal and vertical components 90° out of phase, forming a retrograde surface ellipse: as the ground rises it moves backwards towards the epicentre, then down and forwards – a wave-like effect that overturns foundations. Love shakes sideways (SH), without vertical motion, but is trapped in the crust → large amplitude and long duration.","Tabel comparativ Love vs Rayleigh":"Love vs Rayleigh comparison","Caracteristică":"Property","Love (SH)":"Love (SH)","Rayleigh (P-SV)":"Rayleigh (P-SV)","Transversal orizontal ⊥ propagare, fără Z":"Horizontal transverse ⊥ propagation, no Z","Eliptică în plan vertical XZ, retrogradă la suprafață, progradă la ~0.19λ":"Ellipse in the vertical XZ plane, retrograde at surface, prograde at ~0.19λ","vS_crust < vL < vS_mantă, dispersivă ~3.1-4.4 km/s (scade cu f)":"vS_crust < vL < vS_mantle, dispersive ~3.1–4.4 km/s (decreases with f)","ă, dispersivă ~3.1-4.4 km/s (scade cu f)":", dispersive ~3.1–4.4 km/s (decreases with f)","vR≈0.92·vS≈3.2 km/s, slab dispersivă, ~0.9 vS":"vR≈0.92·vS≈3.2 km/s, weakly dispersive, ~0.9 vS","Dispersie":"Dispersion","Puternic dispersivă – ghid de undă crustă, f joasă → pătrunde mai adânc → v mai mare":"Strongly dispersive – crustal waveguide, low f → deeper penetration → greater v","Dispersie slabă, dependentă de structura crustei, viteză crește ușor cu T":"Weak dispersion, dependent on crustal structure; speed rises slightly with T","Amplitudine vs adâncime":"Amplitude vs depth","A(z)=A0·exp(-z/δ)·sin(πz/H), max în crustă, zero la suprafață liberă? prindere în strat":"A(z)=A0·exp(-z/δ)·sin(πz/H), maximum in crust, zero at free surface? Layer trapping","A(z)=A0·exp(-k z), scade exponențial, 90% energie în 1λ adâncime":"A(z)=A0·exp(-k z), exponential decay, 90% of energy within 1λ depth","Distructivitate":"Destructiveness","Mare orizontal, clădiri înalte – forfecare laterală lungă durată":"Large horizontal motion, tall buildings – prolonged lateral shear","Cea mai distructivă – mișcare eliptică răstoarnă, verticală + orizontală combinate":"Highly destructive – elliptical overturning motion, combined vertical and horizontal components","Înregistrare seismogramă":"Seismogram recording","Dominant pe orizontal N-S/E-W, fără Z":"Dominant horizontal N-S/E-W, no Z","Z + orizontal în direcția propagării, fază 90°, elipsă":"Z + horizontal along propagation, phase 90°, ellipse","📚 Carte teorie Love & Rayleigh:":"📚 Love & Rayleigh theory:","• Love 1911: undă SH prinsă între suprafață liberă și interfață cu viteză mai mare (Moho). Condiție ghid: reflexie totală la interfață, interferență constructivă în strat. vL = ω/k, ecuație dispersie tan(k_H·H)=... unde k_H = ω√(1/vS_c² -1/vL²). În limita f→∞, vL→vS_crust; f→0, vL→vS_mantă.":"• Love 1911: SH wave trapped between a free surface and a faster interface (Moho). Guiding condition: total reflection at the interface, constructive interference in the layer. vL = ω/k, dispersion equation tan(k_H·H)=... where k_H = ω√(1/vS_c² -1/vL²). As f→∞, vL→vS_crust; as f→0, vL→vS_mantle.","• Love 1911: undă SH prinsă între suprafață liberă și interfață cu viteză mai mare (Moho). Condiție ghid: reflexie totală la interfață, interferență constructivă în strat. vL = ω/k, ecuație dispersie tan(k":"• Love 1911: SH wave trapped between a free surface and a faster interface (Moho). Guiding condition: total reflection at the interface, constructive interference in the layer. vL = ω/k, dispersion equation tan(k","·H)=... unde k":"·H)=... where k","). În limita f→∞, vL→vS":"). As f→∞, vL→vS","; f→0, vL→vS":"; as f→0, vL→vS","ă.":".","• Rayleigh 1885: soluție P-SV cuplată la suprafață liberă, condiție det |M|=0 → vR≈0.92 vS pentru Poisson 0.25. Mișcare eliptică retrogradă la suprafață deoarece componenta verticală și orizontală sunt în cuadratură. La ~0.19λ sensul devine prograd (particula sus se mișcă înainte). Energia prinsă în ~λ adâncime, de aceea distructivă.":"• Rayleigh 1885: coupled P-SV solution at a free surface, determinant condition det |M|=0 → vR≈0.92 vS for Poisson ratio 0.25. Surface motion is retrograde elliptical because vertical and horizontal components are in quadrature. At ~0.19λ it becomes prograde (upper particle motion is forwards). Energy is trapped within ~λ depth, hence its destructive effect.","• De ce rostogolește: cuplul vertical+orizontal creează moment de răsturnare pe fundații. Clădirile cu frecvență proprie ~0.1-0.3Hz (10-30 etaje) intră în rezonanță cu Rayleigh de 10-20s perioadă → amplificare.":"• Why rolling occurs: the vertical/horizontal couple creates an overturning moment on foundations. Buildings with natural frequency ~0.1–0.3Hz (10–30 floors) resonate with Rayleigh waves of 10–20s period → amplification.","• Atenuare geometrică: unde de suprafață ∝1/√r (cilindric) vs unde de volum ∝1/r (sferic) → se propagă mai departe cu amplitudine mare → se simt la sute km.":"• Geometrical attenuation: surface waves ∝1/√r (cylindrical) vs body waves ∝1/r (spherical) → retain large amplitudes farther away and are felt hundreds of km away."}},"courses/unde-mecanice/theory":{"locale":"en","namespace":"courses/unde-mecanice/theory","messages":{"1.3.1 Clasificarea undelor":"1.3.1 Wave classification","Mărimi caracteristice":"Characteristic quantities","Ecuația undei plane":"Plane-wave equation","Principiul Huygens":"Huygens principle","1.3.2 Reflexia, refracția, difracția":"1.3.2 Reflection, refraction, diffraction","1.3.3 Interferența & Bătăi":"1.3.3 Interference & Beats","1.3.4 Unde staționare":"1.3.4 Standing waves","1.3.5 Instrumente muzicale":"1.3.5 Musical instruments","1.3.6 Acustica":"1.3.6 Acoustics","Efectul Doppler":"Doppler effect","11. Laborator acustic (chitară/castron/tobă/xilofon)":"11. Acoustic laboratory (guitar/bowl/drum/xylophone)","12. De ce cad blocurile – rezonanță":"12. Why buildings collapse – resonance","13. Laborator Avansat - 5 standuri":"13. Advanced laboratory – 5 stations","14. Jurnal de laborator":"14. Laboratory journal","15. Ghid profesor + Fișe":"15. Teacher guide + Worksheets","16. Glosar + Hartă formule":"16. Glossary + Formula map","Probleme de verificare":"Practice problems","17. Test Grilă – Fundamente":"17. Multiple-choice test – Fundamentals","18. Test Grilă – Acustică":"18. Multiple-choice test – Acoustics","Acasă — Unde mecanice":"Home — Mechanical waves","FIZICĂ • CLASA a XI-a":"PHYSICS • GRADE XI","Unde mecanice":"Mechanical waves","Offline • fără internet":"Offline • no internet","Canvas + Web Audio":"Canvas + Web Audio","⌂ Acasă":"⌂ Home","📚 Mod Lecție":"📚 Guided lesson","Toggle dark mode":"Toggle dark mode","Cuprinsul lecției":"Lesson contents","Cum folosești aplicația:":"How to use the application:","• Toate simulările rulează local (Canvas 60fps)":"• All simulations run locally (Canvas 60fps)","• Sunetele sunt sintetizate, nu fișiere":"• Sounds are synthesised, not audio files","• Salvează fișierul HTML pentru offline complet":"• Save the HTML file for complete offline use","• Dark mode salvat în localStorage":"• Dark mode saved in localStorage","Unde mecanice – lecție completă offline":"Mechanical waves – complete offline lesson","Ediție extinsă: teorie despre unde + 4 instrumente (chitară Karplus-Strong, castron tibetan, tobă Bessel, xilofon bară liberă) + sonometru, Kundt, osciloscop live + jurnal editabil, mod lecție ghidată 14 pași, ghid profesor, glosar 20 termeni, hartă formule. Totul Canvas + Web Audio, offline, fără CDN.":"Extended edition: grade XI theory + 4 instruments (Karplus–Strong guitar, Tibetan bowl, Bessel drum, free-bar xylophone) + sonometer, Kundt, live oscilloscope + editable journal, 14-step guided lesson, teacher guide, 20-term glossary, formula map. All Canvas + Web Audio, offline, no CDN.","definiții • formule • demonstrații • simulări • laborator":"definitions • formulas • demonstrations • simulations • laboratory","fără CDN / MathJax extern":"no external CDN / MathJax","1.3.1 Clasificarea undelor. Propagarea. Front de undă, rază. Principiul Huygens.":"1.3.1 Wave classification. Propagation. Wavefront, ray. Huygens principle.","Unda mecanică":"The mechanical wave","= perturbație care se propagă în mediu material cu transport de energie, fără transport de substanță (medie oscilantă în jurul poziției de echilibru).":"= a disturbance propagating through a material medium, carrying energy without transporting matter (oscillation around equilibrium).","oscilație ⊥ propagare (coardă, undă pe apă – parțial).":"oscillation ⊥ propagation (string, partially a water wave).","oscilație ∥ propagare (sunet în aer, resort).":"oscillation ∥ propagation (sound in air, spring).","De suprafață:":"Surface:","la interfață, compuse (eliptice).":"at an interface, combined (elliptical).","Definiții":"Definitions","Front de undă = locul geometric al punctelor cu aceeași fază la un moment dat. Raza = direcția ⊥ pe front (direcția de propagare, v).":"Wavefront = locus of points with the same phase at a given instant. Ray = direction ⊥ to the front (propagation direction, v).","1.3.1b Undă plană vs sferică – atenuare":"1.3.1b Plane vs spherical wave – attenuation","Unda plană: fronturi plane paralele, sursă la infinit, A=const, I=const. Sferică: fronturi sferice, amplitudine scade ~1/r, intensitate I=P/4πr² ~1/r². Frontul e perpendicular pe rază.":"Plane wave: parallel plane fronts, source at infinity, A=const, I=const. Spherical: spherical fronts, amplitude decreases ~1/r, intensity I=P/4πr² ~1/r². Front is perpendicular to the ray.","Unda plană: fronturi plane paralele, sursă la infinit, A=const, I=const. Sferică: fronturi sferice, amplitudine scade ~1/r, intensitate I=P/4πr":"Plane wave: parallel plane fronts, source at infinity, A=const, I=const. Spherical: spherical fronts, amplitude decreases ~1/r, intensity I=P/4πr",". Frontul e perpendicular pe rază.":". Front is perpendicular to the ray.","Atenuare sferică":"Spherical attenuation","A(r)=A₀·R₀/r, I(r)=I₀·R₀²/r² = P/(4πr²), la dublarea distanței -6 dB":"A(r)=A₀·R₀/r, I(r)=I₀·R₀²/r² = P/(4πr²); distance doubling gives -6 dB","), la dublarea distanței -6 dB":"); distance doubling gives -6 dB","Undele de suprafață pe apă nu sunt unde transversale pure.":"Water surface waves are not purely transverse waves.","particulele de apă descriu":"water particles trace","în plan vertical – mișcarea are componentă longitudinală și transversală, cu amplitudine ce scade cu adâncimea. Sunt unde gravitaționale-capilare compuse.":"in a vertical plane – motion has longitudinal and transverse components, with amplitude decreasing with depth. These are combined gravity-capillary waves.","1.3.1c Unde de suprafață - tranziție circular → eliptic (apă adâncă vs mică)":"1.3.1c Surface waves – circular → elliptical transition (deep vs shallow water)","1.3.1d Tsunami Pacific – hartă batimetrie reală":"1.3.1d Pacific tsunami – bathymetry map","Mărimi caracteristice ale undelor":"Characteristic wave quantities","Perioadă T, frecvență ν=1/T, pulsație ω=2πν, lungime de undă λ = distanța pe care se propagă unda în T, număr de undă k=2π/λ, viteză v.":"Period T, frequency ν=1/T, angular frequency ω=2πν, wavelength λ = distance travelled by the wave in T, wavenumber k=2π/λ, speed v.","1.3.1c Energie și intensitate":"1.3.1c Energy and intensity","Densitatea totală de energie a unei unde armonice progresive, pentru y=A sin φ: w = ρ ω² A² cos²φ; media temporală ⟨w⟩=½ ρ ω² A². Intensitate I = ⟨w⟩·v = 2π² A² ν² ρ v. Pentru sferică I(r)=I₀·R₀²/r².":"Total energy density of a progressive harmonic wave, for y=A sin φ: w = ρ ω² A² cos²φ; time average ⟨w⟩=½ ρ ω² A². Intensity I = ⟨w⟩·v = 2π² A² ν² ρ v. Spherical wave: I(r)=I₀·R₀²/r².","Densitatea totală de energie a unei unde armonice progresive, pentru y=A sin φ: w = ρ ω":"Total energy density of a progressive harmonic wave, for y=A sin φ: w = ρ ω","φ; media temporală ⟨w⟩=½ ρ ω":"φ; time average ⟨w⟩=½ ρ ω",". Intensitate I = ⟨w⟩·v = 2π":". Intensity I = ⟨w⟩·v = 2π","ρ v. Pentru sferică I(r)=I":"ρ v. Spherical wave: I(r)=I","Observație: v depinde de mediu (elasticitate, inerție), nu de sursă. ν este impusă de sursă. λ se adaptează: λ = v/ν.":"Note: v depends on the medium (elasticity, inertia), not the source. ν is imposed by the source. λ adjusts: λ = v/ν.","Ecuația undei plane progresive":"Progressive plane-wave equation","Considerăm o sursă O care oscilează y_O = A sin ωt. Punctul P la distanța x primește perturbația cu întârziere x/v.":"Consider a source O oscillating as y_O = A sin ωt. Point P at distance x receives the disturbance after delay x/v.","Considerăm o sursă O care oscilează y":"Consider a source O oscillating as y","= A sin ωt. Punctul P la distanța x primește perturbația cu întârziere x/v.":"= A sin ωt. Point P at distance x receives the disturbance after delay x/v.","Demonstrație scurtă (idee)":"Short derivation (idea)","t_P = t - x/v ⇒ y(x,t) = A sin ω(t - x/v) = A sin(ωt - kx) = A sin ω(t - x/v). Pentru undă care se propagă spre x crescător semnul „-”. Pentru undă spre x descrescător: y = A sin(ωt + kx).":"t_P = t - x/v ⇒ y(x,t) = A sin ω(t - x/v) = A sin(ωt - kx) = A sin ω(t - x/v). A wave travelling towards increasing x uses the minus sign. Towards decreasing x: y = A sin(ωt + kx).","= t - x/v ⇒ y(x,t) = A sin ω(t - x/v) = A sin(ωt - kx) = A sin ω(t - x/v). Pentru undă care se propagă spre x crescător semnul „-”. Pentru undă spre x descrescător: y = A sin(ωt + kx).":"= t - x/v ⇒ y(x,t) = A sin ω(t - x/v) = A sin(ωt - kx) = A sin ω(t - x/v). A wave travelling towards increasing x uses the minus sign. Towards decreasing x: y = A sin(ωt + kx).","Fază, viteză de fază, defazaj":"Phase, phase speed, phase difference","φ=ωt-kx fază instantanee, v_f=ω/k=v viteză fază, Δφ=k·Δx defazaj între două puncte.":"φ=ωt-kx instantaneous phase, v_f=ω/k=v phase speed, Δφ=k·Δx phase difference between two points.","φ=ωt-kx fază instantanee, v":"φ=ωt-kx instantaneous phase, v","=ω/k=v viteză fază, Δφ=k·Δx defazaj între două puncte.":"=ω/k=v phase speed, Δφ=k·Δx phase difference between two points.","La t fixat → profil spațial sinusoidal. La x fixat → oscilație armonică în timp. Viteza particulei: v_p = ∂y/∂t = Aω cos(ωt - kx). Accelerație: a = -Aω² sin(...)":"At fixed t → sinusoidal spatial profile. At fixed x → harmonic oscillation in time. Particle velocity: v_p = ∂y/∂t = Aω cos(ωt - kx). Acceleration: a = -Aω² sin(...)","La t fixat → profil spațial sinusoidal. La x fixat → oscilație armonică în timp. Viteza particulei: v":"At fixed t → sinusoidal spatial profile. At fixed x → harmonic oscillation in time. Particle velocity: v","= ∂y/∂t = Aω cos(ωt - kx). Accelerație: a = -Aω":"= ∂y/∂t = Aω cos(ωt - kx). Acceleration: a = -Aω","Principiul Huygens – construcția frontului":"Huygens principle – constructing the front","Fiecare punct al unui front de undă devine sursă de unde elementare sferice; înfășurătoarea acestora este noul front.":"Every point on a wavefront becomes a source of elementary spherical waves; their envelope is the new front.","Principiul Huygens explică reflexia, refracția, difracția și propagarea rectilinie ca limită când λ → 0.":"Huygens principle explains reflection, refraction, diffraction and straight propagation as the limit λ → 0.","unda întâlnește obstacol, se întoarce în mediul 1. Legea: unghi incidență = unghi reflexie, în același plan cu normala.":"the wave meets an obstacle and returns into medium 1. Law: incidence angle = reflection angle, in the plane containing the normal.","Refracția:":"Refraction:","trecerea în mediu 2 cu v₂≠v₁. Frecvența se păstrează, λ₂ = v₂/ν.":"entry into medium 2 with v₂≠v₁. Frequency stays constant, λ₂ = v₂/ν.","trecerea în mediu 2 cu v":"entry into medium 2 with v",". Frecvența se păstrează, λ":". Frequency stays constant, λ","Legea Snell pentru unde mecanice":"Snell's law for mechanical waves","sin i / sin r = v₁ / v₂ sau sin r = (v₂/v₁)· sin i. Dacă v₂ < v₁, r < i (se apropie de normală).":"sin i / sin r = v₁ / v₂ or sin r = (v₂/v₁)· sin i. If v₂ < v₁, r < i (bends towards the normal).","sau sin r = (v":"or sin r = (v",")· sin i. Dacă v":")· sin i. If v",", r < i (se apropie de normală).":", r < i (bends towards the normal).","Capăt FIX vs LIBER – coeficient reflexie":"FIXED vs FREE end – reflection coefficient","Capăt fix = nod deplasare, inversare fază π, R=-1. Capăt liber = ventru deplasare, fără inversare R=+1.":"Fixed end = displacement node, phase inversion π, R=-1. Free end = displacement antinode, no inversion, R=+1.","Coeficient reflexie":"Reflection coefficient","Fix: y_ref=-y_inc, Δφ=π, R=-1. Liber: y_ref=+y_inc, Δφ=0, R=+1. Pentru deplasare transversală pe coardă: R=(Z₁-Z₂)/(Z₁+Z₂). Pentru presiune acustică: R_p=(Z₂-Z₁)/(Z₂+Z₁)":"Fixed: y_ref=-y_inc, Δφ=π, R=-1. Free: y_ref=+y_inc, Δφ=0, R=+1. For transverse displacement on a string: R=(Z₁-Z₂)/(Z₁+Z₂). For acoustic pressure: R_p=(Z₂-Z₁)/(Z₂+Z₁)","Fix: y":"Fixed: y",", Δφ=π, R=-1. Liber: y":", Δφ=π, R=-1. Free: y",", Δφ=0, R=+1. Pentru deplasare transversală pe coardă: R=(Z":", Δφ=0, R=+1. For transverse displacement on a string: R=(Z","). Pentru presiune acustică: R":"). For acoustic pressure: R","Refracție avansată – indice acustic + reflexie totală":"Advanced refraction – acoustic index + total internal reflection","Difracția = ocolirea obstacolelor și împrăștierea după o fantă/orificiu când dimensiunea a ~ λ. Cu cât fanta e mai îngustă, difracția mai pronunțată.":"Diffraction = bending around obstacles and spreading beyond a slit/opening when its size a ~ λ. The narrower the slit, the more pronounced the diffraction.","Difracție Fraunhofer – I(θ)=I₀·(sinβ/β)²":"Fraunhofer diffraction – I(θ)=I₀·(sinβ/β)²","Difracție Fraunhofer – I(θ)=I":"Fraunhofer diffraction – I(θ)=I","Dacă a ≫ λ → umbră geometrică, propagare rectilinie. Dacă a ≈ λ → front circular dincolo de fantă.":"If a ≫ λ → geometrical shadow, straight propagation. If a ≈ λ → circular front beyond the slit.","1.3.3 Interferența. Coerență. Bătăi.":"1.3.3 Interference. Coherence. Beats.","Interferența = suprapunerea a două unde coerente (diferență de fază constantă). Principiul suprapunerii: y = y₁ + y₂.":"Interference = superposition of two coherent waves (constant phase difference). Superposition principle: y = y₁ + y₂.","Interferența = suprapunerea a două unde coerente (diferență de fază constantă). Principiul suprapunerii: y = y":"Interference = superposition of two coherent waves (constant phase difference). Superposition principle: y = y","y₁ = A sin(ωt - kr₁), y₂ = A sin(ωt - kr₂) ⇒ A_rez = 2A |cos(kΔr/2)|. Constructiv: Δr = n·λ (faze egale). Distructiv: Δr = (2n+1)·λ/2 (opoziție).":"y₁ = A sin(ωt - kr₁), y₂ = A sin(ωt - kr₂) ⇒ A_rez = 2A |cos(kΔr/2)|. Constructive: Δr = n·λ (equal phases). Destructive: Δr = (2n+1)·λ/2 (antiphase).","= 2A |cos(kΔr/2)|. Constructiv: Δr = n·λ (faze egale). Distructiv: Δr = (2n+1)·λ/2 (opoziție).":"= 2A |cos(kΔr/2)|. Constructive: Δr = n·λ (equal phases). Destructive: Δr = (2n+1)·λ/2 (antiphase).","Bătăile – caz particular":"Beats – a special case","Două unde cu frecvențe apropiate ν₁≈ν₂ interferează → amplitudine modulată lent.":"Two waves with nearby frequencies ν₁≈ν₂ interfere → slowly modulated amplitude.","Două unde cu frecvențe apropiate ν":"Two waves with nearby frequencies ν","interferează → amplitudine modulată lent.":"interfere → slowly modulated amplitude.","Frecvența bătăilor f_b = |ν₁-ν₂| este frecvența la care auzim maximele de intensitate. Aplicație: acordarea instrumentelor.":"Beat frequency f_b = |ν₁-ν₂| is the rate of audible loudness maxima. Application: tuning instruments.","Frecvența bătăilor f":"Beat frequency f","| este frecvența la care auzim maximele de intensitate. Aplicație: acordarea instrumentelor.":"| is the rate of audible loudness maxima. Application: tuning instruments.","Suprapunerea a două unde progresive identice care se propagă în sensuri opuse: incidentă + reflectată.":"Superposition of two identical progressive waves travelling in opposite directions: incident + reflected.","Demonstrație scurtă":"Short derivation","y₁ = A sin(ωt + kx), y₂ = -A sin(ωt - kx) ⇒ y = y₁+y₂ = 2A sin(kx) cos(ωt) (folosind sin a + sin b = 2 sin((a+b)/2) cos((a-b)/2)). Factorul sin(kx) = amplitudine dependentă de poziție.":"y₁ = A sin(ωt + kx), y₂ = -A sin(ωt - kx) ⇒ y = y₁+y₂ = 2A sin(kx) cos(ωt) (using sin a + sin b = 2 sin((a+b)/2) cos((a-b)/2)). Factor sin(kx) = position-dependent amplitude.","= 2A sin(kx) cos(ωt) (folosind sin a + sin b = 2 sin((a+b)/2) cos((a-b)/2)). Factorul sin(kx) = amplitudine dependentă de poziție.":"= 2A sin(kx) cos(ωt) (using sin a + sin b = 2 sin((a+b)/2) cos((a-b)/2)). Factor sin(kx) = position-dependent amplitude.","sin(kx)=0 ⇒ kx=nπ ⇒ x=n·λ/2 – deplasare mereu zero.":"sin(kx)=0 ⇒ kx=nπ ⇒ x=n·λ/2 – always zero displacement.","|sin|=1 ⇒ x=(2n+1)·λ/4 – amplitudine maximă 2A.":"|sin|=1 ⇒ x=(2n+1)·λ/4 – maximum amplitude 2A.","Coardă fixată la ambele capete: condiție y=0 la x=0 și x=L ⇒ sin(kL)=0 ⇒ kL=nπ ⇒ L = n·λ/2, λₙ=2L/n, νₙ=n·v/(2L), v=√(T/μ)":"String fixed at both ends: y=0 at x=0 and x=L ⇒ sin(kL)=0 ⇒ kL=nπ ⇒ L = n·λ/2, λₙ=2L/n, νₙ=n·v/(2L), v=√(T/μ)","Coardă fixată la ambele capete: condiție y=0 la x=0 și x=L ⇒ sin(kL)=0 ⇒ kL=nπ ⇒ L = n·λ/2, λ":"String fixed at both ends: y=0 at x=0 and x=L ⇒ sin(kL)=0 ⇒ kL=nπ ⇒ L = n·λ/2, λ","1.3.5 Instrumente muzicale: coarde vibrante, tuburi sonore":"1.3.5 Musical instruments: vibrating strings, sound pipes","Coardele și coloanele de aer vibrează în moduri staționare cuantificate de condițiile la limită.":"Strings and air columns vibrate in standing modes quantised by boundary conditions.","Tub cilindric deschis":"Open cylindrical pipe","(flaut, orgă deschisă): ventre de deplasare la ambele capete (aer liber să vibreze), noduri de presiune. L=n·λ/2, νₙ=n·v/2L – toate armonicele.":"(flute, open organ pipe): displacement antinodes at both ends (air free to vibrate), pressure nodes. L=n·λ/2, νₙ=n·v/2L – all harmonics.","(flaut, orgă deschisă): ventre de deplasare la ambele capete (aer liber să vibreze), noduri de presiune. L=n·λ/2, ν":"(flute, open organ pipe): displacement antinodes at both ends (air free to vibrate), pressure nodes. L=n·λ/2, ν","=n·v/2L – toate armonicele.":"=n·v/2L – all harmonics.","Tub cilindric închis":"Closed cylindrical pipe","(clarinet, tub închis): nod de deplasare la capăt închis (aer blocat), ventru la deschis. L=(2n-1)·λ/4, νₙ=(2n-1)·v/4L – doar armonice impare.":"(clarinet, closed pipe): displacement node at the closed end (blocked air), antinode at the open end. L=(2n-1)·λ/4, νₙ=(2n-1)·v/4L – odd harmonics only.","(clarinet, tub închis): nod de deplasare la capăt închis (aer blocat), ventru la deschis. L=(2n-1)·λ/4, ν":"(clarinet, closed pipe): displacement node at the closed end (blocked air), antinode at the open end. L=(2n-1)·λ/4, ν","=(2n-1)·v/4L – doar armonice impare.":"=(2n-1)·v/4L – odd harmonics only.","Numerotarea modurilor într-un tub închis:":"Numbering the modes of a closed pipe:","Clarificare folosită aici:":"Clarification used here:","folosim n=1,2,3,... fizic, cu (2n-1). Astfel fundamentală n=1 → L=λ/4. Pentru instrumente reale, corecție de capăt ΔL≈0.3·d.":"we use physical n=1,2,3,... with (2n-1). Thus the fundamental n=1 → L=λ/4. Real instruments require end correction ΔL≈0.3·d.","1.3.6 Acustica: intensitate, nivel, calități":"1.3.6 Acoustics: intensity, level, qualities","Sunet fundamental + armonice = sunet compus":"Fundamental + harmonics = compound sound","cu timbru caracteristic. Zgomot = spectru continuu aleator.":"with characteristic timbre. Noise = random continuous spectrum.","I = E/(Δt·S) = Putere/Suprafață. Pentru undă plană armonică progresivă: I = 2π²A²ν²ρv. Nivel acustic: L = 10·log₁₀(I/I₀) dB, I₀=10⁻¹² W/m².":"I = E/(Δt·S) = Power/Area. For a progressive harmonic plane wave: I = 2π²A²ν²ρv. Sound level: L = 10·log₁₀(I/I₀) dB, I₀=10⁻¹² W/m².","I = E/(Δt·S) = Putere/Suprafață. Pentru undă plană armonică progresivă: I = 2π":"I = E/(Δt·S) = Power/Area. For a progressive harmonic plane wave: I = 2π","ρv. Nivel acustic: L = 10·log":"ρv. Sound level: L = 10·log","Intensitate":"Intensity","– legată de A, senzație tare/slab.":"– related to A, loud/quiet sensation.","– frecvența fundamentală (grav/acut).":"– fundamental frequency (low/high pitch).","Timbru":"Timbre","– spectru armonice, formă de undă.":"– harmonic spectrum, waveform.","Durată":"Duration","– timp percepție.":"– perception time.","Frecvența percepută se modifică dacă sursa și/sau observatorul se mișcă față de mediu.":"Perceived frequency changes if the source and/or observer move relative to the medium.","Formula generală":"General formula","f' = f·(v ± vₒ)/(v ∓ v_s) ; semnul (+) la numărător dacă observatorul se apropie de sursă, (-) la numitor dacă sursa se apropie de observator. v = viteza undei în mediu.":"f' = f·(v ± vₒ)/(v ∓ v_s) ; numerator (+) if the observer approaches the source, denominator (-) if the source approaches the observer. v = wave speed in the medium.",") ; semnul (+) la numărător dacă observatorul se apropie de sursă, (-) la numitor dacă sursa se apropie de observator. v = viteza undei în mediu.":") ; numerator (+) if the observer approaches the source, denominator (-) if the source approaches the observer. v = wave speed in the medium.","Demonstrație intuitivă: sursa în mișcare comprimă fronturile în față (λ' = λ - v_s·T) → f' mai mare. În spate, λ' = λ + v_s·T → f' mai mică.":"Intuitive derivation: a moving source compresses fronts ahead (λ' = λ - v_s·T) → higher f'. Behind, λ' = λ + v_s·T → lower f'.","Demonstrație intuitivă: sursa în mișcare comprimă fronturile în față (λ' = λ - v":"Intuitive derivation: a moving source compresses fronts ahead (λ' = λ - v","·T) → f' mai mare. În spate, λ' = λ + v":"·T) → higher f'. Behind, λ' = λ + v","·T → f' mai mică.":"·T → lower f'.","Aplicații: radar, ecog ă?":"What does the minus sign in (ωt - kx) mean?","Propagare +x":"Propagation +x","Propagare -x":"Propagation -x","Undă staționară":"Standing wave","4. Principiul Huygens":"4. Huygens principle","Fiecare punct al frontului devine sursă secundară. Înfășurătoarea dă noul front.":"Each point on a front becomes a secondary source. The envelope gives the new front.","Huygens explică...":"Huygens explains...","Difracția":"Diffraction","Doar reflexia":"Reflection only","Nimic":"Nothing","5. Reflexia și refracția":"5. Reflection and refraction","Reflexie: i=r. Refracție: sin i / sin r = v₁/v₂, ν se păstrează, λ se schimbă.":"Reflection: i=r. Refraction: sin i / sin r = v₁/v₂, ν stays constant, λ changes.","Reflexie: i=r. Refracție: sin i / sin r = v":"Reflection: i=r. Refraction: sin i / sin r = v",", ν se păstrează, λ se schimbă.":", ν stays constant, λ changes.","La trecere în mediu mai lent, raza...":"When entering a slower medium, the ray...","Se depărtează de normală":"Bends away from the normal","Se apropie de normală":"Bends towards the normal","Nu se schimbă":"Does not change","6. Difracția":"6. Diffraction","Ocolire obstacole când a≈λ. a≫λ → propagare rectilinie. a≈λ → front circular.":"Waves bend around obstacles when a≈λ. a≫λ → straight propagation. a≈λ → circular front.","Difracția e puternică când:":"Diffraction is strong when:","7. Interferența":"7. Interference","y=y₁+y₂. Constructiv Δr=nλ, distructiv Δr=(2n+1)λ/2. Necesită coerență Δφ constant.":"y=y₁+y₂. Constructive Δr=nλ, destructive Δr=(2n+1)λ/2. Requires coherence, constant Δφ.",". Constructiv Δr=nλ, distructiv Δr=(2n+1)λ/2. Necesită coerență Δφ constant.":". Constructive Δr=nλ, destructive Δr=(2n+1)λ/2. Requires coherence, constant Δφ.","Interferență constructivă: Δr=":"Constructive interference: Δr=","8. Bătăi":"8. Beats","Două frecvențe apropiate → anvelopă lentă f_b=|f₁-f₂|. Anvelopă: 2A cos((ω₁-ω₂)t/2).":"Two nearby frequencies → slow envelope f_b=|f₁-f₂|. Envelope: 2A cos((ω₁-ω₂)t/2).","Două frecv e natural frequency. This is schematic, not a reconstruction of a historical earthquake.","• P și S sunt unde de volum; Love și Rayleigh sunt unde de suprafață. Fiecare poate avea un spectru larg; nu există o asociere universală între tipul undei și înălțimea clădirii afectate.":"• P and S are body waves; Love and Rayleigh are surface waves. Each can have a broad spectrum; wave type does not universally determine the height of affected buildings.","Animație încetinită de 50 ori; frecvența proprie este n·v/(2L).":"Animation slowed by a factor of 50; natural frequency is n·v/(2L).","Model liniar didactic: x este deplasarea relativă față de sol. Geometria, materialele, solul, indicii vizuali și semnalele sonore sunt schematice. Seismograma este sintetică, nu o înregistrare istorică. Acest model nu calculează avarierea sau siguranța unei clădiri.":"Educational linear model: x is displacement relative to the ground. Geometry, materials, soil, visual indices and sounds are schematic. The seismogram is synthetic, not a historical recording. This model does not calculate building damage or safety.","Indice vizual: ":"Visual index: ","Indice vizual:":"Visual index:","Deplasare relativă: ":"Relative displacement: ","Deplasare relativă:":"Relative displacement:","Bară liberă–liberă ideală: forme modale Euler–Bernoulli. Suporturile 0,224L și 0,776L coincid aproximativ cu nodurile fundamentalei, nu cu nodurile tuturor modurilor. Reprezentare încetinită; parțiale nearmonice.":"Ideal free–free bar: Euler–Bernoulli mode shapes. Supports at 0.224L and 0.776L approximately match fundamental nodes, not the nodes of every mode. Slowed illustration; inharmonic partials.","Modurile și rapoartele sunt o sinteză ilustrativă. Un castron real are frecvențe care depind de geometrie, grosime și material; aceste rețete nu reprezintă măsurători.":"The modes and ratios are an illustrative synthesis. Real bowl frequencies depend on geometry, thickness and material; these recipes are not measuremen ptic?":"Why circular → elliptical?","Unda de suprafață combină mișcare transversală (ridicare) + longitudinală (înainte-înapoi) defazate 90° → traiectorie circulară în apă adâncă: r(z)=A·e^":"A surface wave combines transverse (up–down) and longitudinal (back–forth) motion, 90° out of phase → circular path in deep water: r(z)=A·e^","Fundul impermeabil blochează componenta verticală: w=0 la z=-h → orbita se turtește: a= A·cosh(k(z+h))/sinh(kh), b= A·sinh(k(z+h))/sinh(kh). La fund b→0, rămâne doar oscilație orizontală.":"The impermeable bottom blocks vertical motion: w=0 at z=-h → the orbit flattens: a= A·cosh(k(z+h))/sinh(kh), b= A·sinh(k(z+h))/sinh(kh). At the bottom b→0, leaving horizontal oscillation only.","Apă mică:":"Shallow water:","kh<<1 → tanh(kh)≈kh → v≈√(gh) independent de λ! Unde non-dispersive → tsunami păstrează forma.":"kh<<1 → tanh(kh)≈kh → v≈√(gh), independent of λ! Non-dispersive waves → tsunami retains its shape.","🌋 Aplicații":"🌋 Applications","λ~200km, h=4km → v=√(gh)=√(9.81·4000)=198 m/s ≈ 713 km/h. h/λ=0.02 → apă mică! Non-dispersiv, energie pe toată coloana.":"λ~200km, h=4km → v=√(gh)=√(9.81·4000)=198 m/s ≈ 713 km/h. h/λ=0.02 → shallow water! Non-dispersive, energy throughout the water column.","Valuri de vânt:":"Wind waves:","λ=10-100m, h>λ/2 → adâncă, v≈√(gλ/2π) ~ dispersiv, valuri lungi mai rapide.":"λ=10-100m, h>λ/2 → deep, v≈√(gλ/2π) ~ dispersive, longer waves are faster.","Spargere la mal:":"Breaking at the shore:","când A/h≈0.78 (H/h≈0.78 criteriu Miche), viteză orizontală particulă > v fază → creastă depășește baza, spumă.":"when A/h≈0.78 (H/h≈0.78 Miche criterion), horizontal particle speed > phase speed → crest overtakes base, foam forms.","• Lac mic h=2m, λ=20m → intermediar, viteză între cele două formule.":"• Small lake h=2m, λ=20m → intermediate, speed between the two formulas.","✔ Orbite ON":"✔ Orbits ON","Orbite OFF":"Orbits OFF","✔ Viteză ON":"✔ Speed ON","Viteză OFF":"Speed OFF","↩ Ieși tsunami":"↩ Leave tsunami mode","🌊 Simulează tsunami λ=200km h=4000m":"🌊 Simulate tsunami λ=200km h=4000m","🔊 Sunet ON":"🔊 Sound ON","🔈 Sunet OFF (80Hz adânc / foșnet mic)":"🔈 Sound OFF (80Hz deep / shallow-water noise)","↺ Reset trail":"↺ Reset trails","15 particule: 3 coloane ×5 adâncimi. Culori: suprafață roșu, 22% portocaliu, 48% albastru, 74% cyan, 94% verde aproape de fund. Trail 15 puncte. Spargere când A/h>0.78 → spumă albă + sunet 400→90Hz. Sunet: apă adâncă = bolborosit 78Hz lowpass, apă mică = zgomot bandpass 900Hz + pocnet spargere.":"15 particles: 3 columns ×5 depths. Colours: red surface, orange 22%, blue 48%, cyan 74%, green 94% near the bottom. 15-point trails. Breaking when A/h>0.78 → white foam + 400→90Hz sound. Sound: deep water = 78Hz low-pass bubbling, shallow water = 900Hz band-pass noise + breaking crack.","2011 Tohoku, Japonia":"2011 Tohoku, Japan","Pacific":"Pacific","Groapa Marianelor ~10km":"Mariana Trench ~10km","Fosa Chile ~8km":"Chile Trench ~8km","Tokyo":"Tokyo","Hawaii":"Hawaii","California (Crescent City)":"California (Crescent City)","Valdivia Chile":"Valdivia Chile","Sumatra":"Sumatra","T+ {p0} h ({p1} min)":"T+ {p0} h ({p1} min)","Front activ {p0}/120 breaking {p1}":"Active front {p0}/120 breaking {p1}","Front activ":"Active front","/120 breaking":"/120 breaking","Custom {p0},{p1} h={p2}m":"Custom {p0},{p1} h={p2}m","Custom":"Custom","1960 Valdivia, Chile":"1960 Valdivia, Chile","2004 Sumatra":"2004 Sumatra","2010 Maule, Chile":"2010 Maule, Chile","🌊 STAND NOU – Tsunami – propagare pe batimetrie reală Pacific":"🌊 Tsunami – propagation over Pacific bathymetry","USCAT":"LAND","✓ Click pe hartă plasează epicentru":"✓ Click the map to place the epicentre","Custom click":"Custom click","Magnitudine Mw":"Magnitude Mw","Viteză animație":"Animation speed","A₀ inițial ~":"Initial A₀ ~","A":"Initial A","inițial ~":"~","▶ Start propagare":"▶ Start propagation","↺ Reset":"↺ Reset","✔ Batimetrie ON":"✔ Bathymetry ON","Batimetrie OFF":"Bathymetry OFF","✔ Viteze ON":"✔ Speeds ON","Viteze OFF":"Speeds OFF","🔊 Huruit ON (28-80Hz)":"🔊 Rumble ON (28-80Hz)","🔈 Sunet OFF":"🔈 Sound OFF","📋 Tabel stații – ETA & înălțime":"📋 Station table – ETA & height","Stație":"Station","Distanță km":"Distance km","ETA":"ETA","Înălțime":"Height","Status":"Status","✅ sosit":"✅ arrived","⏳ aștept":"⏳ waiting","Izocrone la fiecare 1h (culoare). Când frontul atinge stația (<18px) înregistrăm timpul și A local cu Green.":"Isochrones every 1h (colour). When the front reaches a station (<18px), arrival time and local A are recorded using Green's law.","Timp simulat:":"Simulated time:","min) – timp real Pacific 20-24h":"min) – real Pacific travel time 20–24h","Front activ:":"Active front:","/120, breaking:":"/120, breaking:","Epicentru h₀=":"Epicentre h₀=","Epicentru h":"Epicentre h","m → la mal h=20m A≈":"m → at shore h=20m A≈","m (Green + breaking)":"m (Green + breaking)","Legea Green: A=A₀·(h₀/h)^":"Green's law: A=A₀·(h₀/h)^","Legea Green: A=A":"Green's law: A=A","(conservare flux energie c_g·E = const, c_g=√(gh) în apă mică). Timp sosire: T=∫ ds/√(g·h(s)) de-a lungul razei. Pentru h=4000m v≈198 m/s=713 km/h, λ tsunami 200km → h/λ=0.02 <<1 deci apă mică.":"(conservation of energy flux c_g·E = const, c_g=√(gh) in shallow water). Arrival time: T=∫ ds/√(g·h(s)) along the ray. For h=4000m v≈198 m/s=713km/h, tsunami λ 200km → h/λ=0.02 <<1, so shallow water.","(conservare flux energie c":"(conservation of energy flux c","=√(gh) în apă mică). Timp sosire: T=∫ ds/√(g·h(s)) de-a lungul razei. Pentru h=4000m v≈198 m/s=713 km/h, λ tsunami 200km → h/λ=0.02 <<1 deci apă mică.":"=√(gh) in shallow water). Arrival time: T=∫ ds/√(g·h(s)) along the ray. For h=4000m v≈198 m/s=713km/h, tsunami λ 200km → h/λ=0.02 <<1, so shallow water.","🌊 De ce tsunami = undă în apă mică?":"🌊 Why is a tsunami a shallow-water wave?","λ tsunami ~200 km (T=10-30min, v=700km/h), h ocean=4km → h/λ=0.02 ≤0.05 → regim apă mică, v=√(gh) independent de λ, non-dispersiv, păstrează forma la mii km. Val vânt λ=100m, h=4000m → h/λ=40 → apă adâncă v=√(gλ/2π) dispersiv.":"Tsunami λ ~200 km (T=10-30min, v=700km/h), ocean h=4km → h/λ=0.02 ≤0.05 → shallow-water regime, v=√(gh) independent of λ, non-dispersive, retaining shape over thousands of km. Wind wave λ=100m, h=4000m → h/λ=40 → deep water v=√(gλ/2π), dispersive.","În larg A~0.5m invizibil (pantă 0.5m/200km). La mal h scade 4000→20m → (4000/20)^":"Offshore A~0.5m, barely visible (slope 0.5m/200km). Near shore h falls 4000→20m → (4000/20)^","=3.76×, plus focalizare batimetrică și rezonanță golf → 10-30m.":"=3.76×, plus bathymetric focusing and bay resonance → 10–30m.","Perioadă lungă → nu sparge ca val vânt, ci urcă ca maree rapidă, curenți 10 m/s.":"Long period → instead of breaking like a wind wave, it rises like a rapid tide, with 10 m/s currents.","🌀 De ce se curbează frontul? Refracție batimetrică":"🌀 Why does the front curve? Bathymetric refraction","v=√(gh) depinde de h(x,y). Front mai lent în zone puțin adânci (creastă submarină, insule) → legea Snell: sinθ₁/ sinθ₂ = v₁/v₂ = √(h₁/h₂). Partea din apă adâncă avansează mai repede, frontul se curbează spre zona puțin adâncă (focalizare). Model simplificat: fiecare punct front are unghi corectat cu (v_dreapta - v_stânga)/v ·0.018 rad per pas (Huygens).":"v=√(gh) depends on h(x,y). The front slows in shallow regions (submarine ridges, islands) → Snell's law: sinθ₁/ sinθ₂ = v₁/v₂ = √(h₁/h₂). The deep-water part advances faster, bending the front towards shallows (focusing). Simplified model: each front point has its angle corrected by (v_right - v_left)/v ·0.018 rad per step (Huygens).","v=√(gh) depinde de h(x,y). Front mai lent în zone puțin adânci (creastă submarină, insule) → legea Snell: sinθ":"v=√(gh) depends on h(x,y). The front slows in shallow regions (submarine ridges, islands) → Snell's law: sinθ","). Partea din apă adâncă avansează mai repede, frontul se curbează spre zona puțin adâncă (focalizare). Model simplificat: fiecare punct front are unghi corectat cu (v":"). The deep-water part advances faster, bending the front towards shallows (focusing). Simplified model: each front point has its angle corrected by (v","ânga)/v ·0.018 rad per pas (Huygens).":")/v ·0.018 rad per step (Huygens).","Batimetria reală Pacific: lanț Hawaii, Platoul Ontong Java deviază.":"Pacific bathymetry: the Hawaii chain and Ontong Java Plateau deflect the front.","Prima sosire poate fi":"The first arrival may be","(trough) dacă sursa e subsidiență: fundul oceanului coboară → jgheab, sau dacă ești în direcția N-S față de falie.":"(a trough) if the source is subsidence: the ocean floor drops → trough; or when you lie north/south of the fault.","📚 Card galben – formule cheie":"📚 Key formulas","• v=√(gh), g=9.81, h adâncime locală. h=4000→v=198m/s=713km/h, h=6000→242m/s=873km/h, h=20→14m/s=50km/h.":"• v=√(gh), g=9.81, h local depth. h=4000→v=198m/s=713km/h, h=6000→242m/s=873km/h, h=20→14m/s=50km/h.","• Timp sosire: T=∫ ds / v(s). Izocrone la 1h = linii egal timp, nu cercuri perfecte din cauza h variabil.":"• Arrival time: T=∫ ds / v(s). 1h isochrones = equal-time lines, not perfect circles because h varies.","• Green: A=A₀·(h₀/h)^":"• Green: A=A₀·(h₀/h)^","·√(r₀/r) (shoaling + spreading cilindric). Ex: h₀=4000, h=10 → (400)^":"·√(r₀/r) (shoaling + cylindrical spreading). E.g. h₀=4000, h=10 → (400)^","/r) (shoaling + spreading cilindric). Ex: h":"/r) (shoaling + cylindrical spreading). E.g. h","=4.47×. Cu focalizare golf (V) încă ×2-3 → 10×.":"=4.47×. Bay focusing adds ×2–3 → 10×.","• Tsunami vs val vânt: T tsunami 600-1800s vs vânt 5-15s, λ 200km vs 100m, E pe toată coloana vs doar suprafață, non-dispersiv vs dispersiv, perioadă mare → inundație nu spargere.":"• Tsunami vs wind wave: T tsunami 600–1800s vs wind 5–15s, λ 200km vs 100m, energy throughout the column vs near surface only, non-dispersive vs dispersive, long period → flooding rather than breaking.","• Breaking: criteriu A/h≈0.78 (Miche). La mal front devine perete vertical.":"• Breaking: criterion A/h≈0.78 (Miche). Near shore the front becomes a vertical wall.","120 puncte front, Huygens simplificat, batimetrie sintetică: 4500m bază + 5 gropi (Mariana 10km, Chile 8km, Aleutian 7km, Sumatra 7km, Tonga 6.5km) + shallow 200m la 80px de coaste. Continente bej poligoane simple. Sunet: osc 28Hz lowpass 120-720Hz, gain 0.04→0.4 când intră în shallow, frecvență crește spre mal. Toate offline Canvas, fără CDN, CSS vars dark mode.":"120 front points, simplified Huygens model, synthetic bathymetry: 4500m baseline + 5 trenches (Mariana 10km, Chile 8km, Aleutian 7km, Sumatra 7km, Tonga 6.5km) + 200m shallows within 80px of coasts. Beige polygon continents. Sound: 28Hz oscillator, 120–720Hz low-pass, gain 0.04→0.4 in shallows, frequency rises near shore. Offline Canvas, no CDN, dark-mode CSS variables."}}}}});</script><script src="../../shared/sound.js"></script><script src="../../shared/lab-header.js"></script><script src="../../shared/canvas-typography.js"></script><script src="../../shared/scientific-colors.js"></script><script src="../../shared/course-localization.js"></script><script src="../../shared/animation-clock.js"></script><script src="../../shared/waves-audio.js"></script><style id="praxis-link-colors">/* One link colour across the library, imported lessons and standalone exports. */
